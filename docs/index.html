<title>Voice Finance</title>
<style>:root{--f:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Helvetica Neue',Arial,sans-serif;
 --tx:#f5f5f7;--mu:#9b9ba6;--mu2:#6d6d78;--ac:#ff7d83;--ac2:#ff454f;--gr:#66d896;--ln:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--f);color:var(--tx);-webkit-text-size-adjust:100%}
html{background-color:#050507;background-image:linear-gradient(to right,var(--glc,rgba(148,148,148,.17)) 1px,transparent 1px),linear-gradient(to bottom,var(--glc,rgba(148,148,148,.17)) 1px,transparent 1px);background-size:var(--gc,48.75px) var(--gc,48.75px);background-position:var(--gx,0) var(--gy,0)}body{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:-2;background:#050507}
.page{position:absolute;inset:0;overflow:hidden;touch-action:none;will-change:transform}
.inner{position:relative;padding:calc(env(safe-area-inset-top,0px) + var(--pdT,80px)) calc(16px + var(--pdR,0px)) calc(var(--pdB,150px) + env(safe-area-inset-bottom,0px)) calc(16px + var(--pdL,0px))}
.inner>div{margin:0 0 14px}
/* ---------- блоки ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px 2px}
.hdr h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.6px}
.hdr .sub{font-size:14px;color:var(--mu);margin-top:3px}
.hdr .back{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid var(--ln);font-size:22px;line-height:1;padding-bottom:3px}
.sec{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:8px 6px 0}
.tile{position:relative;border-radius:28px;padding:18px;border:1px solid rgba(255,255,255,.1);
 background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.03) 60%,rgba(255,255,255,.045))}
.tile.bal.up{background:linear-gradient(155deg,rgba(60,200,120,.12),rgba(60,200,120,.03) 62%,rgba(255,255,255,.02));border-color:rgba(60,210,130,.2)}
.tile.bal.dn{background:linear-gradient(155deg,rgba(255,125,131,.13),rgba(255,125,131,.03) 62%,rgba(255,255,255,.02));border-color:rgba(255,125,131,.22)}
.lbl{font-size:13px;color:var(--mu);font-weight:500}
.big{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px;margin-top:5px;white-space:nowrap}
.mid{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.chg{font-size:14px;font-weight:600;margin-top:6px;color:var(--gr)}.chg.neg{color:var(--ac)}.chg span{color:var(--mu);font-weight:500;margin-left:6px}
.spark{display:block;width:100%;height:84px;margin:14px 0 4px}
.split{display:flex;gap:10px;margin-top:12px}
.split>button{flex:1;display:flex;gap:10px;align-items:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln);min-width:0}
.split b{display:block;font-size:17px;font-weight:650;white-space:nowrap}
.dot{width:30px;height:30px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;font-weight:700}
.dot.up{background:rgba(102,216,150,.16);color:var(--gr)}.dot.dn{background:rgba(255,125,131,.16);color:var(--ac)}
.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.th h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.3px}
.th button{font-size:14px;color:var(--ac);font-weight:600;padding:4px 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--ln)}
.th+.row,.row.first{border-top:0}
.ic{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-style:normal}
.rc{flex:1;min-width:0}.rc b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{display:block;font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-size:16px;font-weight:650;white-space:nowrap}.row em.in{color:var(--gr)}
.row.paid{opacity:.5}
.empty{font-size:14px;line-height:1.45;color:var(--mu);padding:6px 0 4px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff9a9e,var(--ac2))}
.cap{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.4}
.srch{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--ln);color:var(--mu)}
.srch svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--tx);-webkit-appearance:none}
.srch input::placeholder{color:var(--mu2)}
.tools{display:flex;gap:10px}
.pillb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--ln);font-size:15px;font-weight:600;white-space:nowrap}
.pillb.ac{background:rgba(255,125,131,.16);border-color:rgba(255,125,131,.32);color:var(--ac)}
.pillb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:13px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln)}
.mini b{display:block;font-size:19px;margin-top:3px;font-weight:650;white-space:nowrap}
.cat{display:flex;align-items:center;gap:10px;margin-top:11px}.cat:first-of-type{margin-top:6px}
.cat .n{width:96px;font-size:14px;font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .b{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.cat .b i{display:block;height:100%;border-radius:4px;background:var(--c)}
.cat .a{width:78px;text-align:right;font-size:14px;font-weight:600;flex:none;white-space:nowrap}
.dd{display:inline-flex;align-items:center;gap:6px}
/* ---------- док ---------- */
#gl{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s}
#dock{will-change:transform;position:fixed;z-index:25;left:0;right:0;margin:0 auto;width:calc(100% - 28px);max-width:440px;height:72px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:none;-webkit-user-select:none;user-select:none}
#dock{pointer-events:none}
#btns{display:flex;height:100%;padding:0 6px;pointer-events:auto;transform-origin:0 0;-webkit-touch-callout:none}
#btns button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10px var(--f);text-align:center;color:#fff;opacity:.7;transition:opacity .25s;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#btns button.on{opacity:1}
#btns svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#inp{position:fixed;left:0;top:0;z-index:31;margin:0;padding:0 56px 0 22px;width:0;height:0;border:0;outline:0;border-radius:26px;background:transparent;color:transparent;caret-color:transparent;font:400 17px var(--f);-webkit-appearance:none;appearance:none;pointer-events:none;-webkit-user-select:text;user-select:text;transition:color .15s}
#inp.show{color:#fff;caret-color:var(--ac)}
#inp::placeholder{color:transparent;transition:color .15s}
#inp.show::placeholder{color:rgba(255,255,255,.55)}
/* ---------- скляне меню (Додатково / списки) ---------- */
#menuShade{position:fixed;inset:0;z-index:27;display:none}
#menu{position:fixed;z-index:30;left:0;top:0;display:none;color:#fff;overflow:hidden;will-change:transform,opacity;border-radius:24px;touch-action:pan-y}
#menu.more{border-radius:62px;padding:24px 16px 22px;overflow-y:auto;overscroll-behavior:contain}
#menu .drh{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 8px}
#menu .drh h2{margin:0;font-size:27px;font-weight:750;letter-spacing:-.4px}
#menu .drx{width:36px;height:36px;border-radius:18px;font-size:15px;color:rgba(255,255,255,.75)}
#menu .gcard{position:relative;margin:12px 0 0;padding:10px 12px 8px;border-radius:26px}
#menu .qa .gbtn{flex:1;width:auto;margin:0;height:46px;border-radius:23px;font-size:13.5px}
#menu .qa{margin:10px 0 2px}
#menu .mh{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.62);padding:10px 6px 4px}
#menu .mh:first-child{padding-top:2px}
#menu .mhl{display:flex;justify-content:space-between;align-items:center}#menu .mhl button{font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--ac);font-weight:650;padding:0 2px}
#menu .qa{display:flex;gap:8px;margin:6px 0 2px}
#menu .qa button{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;text-align:center}
#menu .mr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;border-radius:14px;font-size:15px;font-weight:550}
#menu .mr:active{background:rgba(255,255,255,.1)}
#menu .mr .ic{width:32px;height:32px;border-radius:16px;font-size:13px}
#menu .mr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mr .v{font-size:14px;color:rgba(255,255,255,.7);white-space:nowrap}
#menu.dd{padding:6px}
#menu.dd .mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:46px;padding:0 14px;border-radius:16px;font-size:16px;font-weight:550;white-space:nowrap}
#menu.dd .mi:active,#menu.dd .mi.cur{background:rgba(255,255,255,.12)}
#menu.dd .mi svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ---------- аркуші (форми) ---------- */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sh h3{margin:0;font-size:18px;font-weight:650;text-align:center;flex:1}
.sh button{font-size:16px;font-weight:600;padding:8px 10px;min-width:70px}
.sh .cn{color:var(--mu);text-align:left}.sh .ok{color:var(--ac);text-align:right}
.seg{display:flex;padding:3px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:15px;text-align:center;font-size:15px;font-weight:600;color:var(--mu)}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid var(--ln)}
.fr:last-of-type{border-bottom:0}
.fr>label,.fr>span.l{font-size:16px;color:var(--mu);flex:none}
.fr input[type=text],.fr input[type=search],.fr input[type=number],.fr input:not([type]){flex:1;min-width:0;text-align:right;background:none;border:0;outline:0;font-size:17px;padding:12px 0;-webkit-appearance:none;border-radius:0;color:#fff}
.fr input::placeholder{color:var(--mu2)}
.fr .dd{font-size:17px;font-weight:600;color:#fff;padding:12px 0;max-width:62%}
.fr .dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .dd svg{width:12px;height:12px;fill:none;stroke:var(--mu);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac2)}.sw.on::after{transform:translateX(20px)}
.err{color:var(--ac);font-size:14px;padding:8px 2px 0;min-height:0}
.btnw{display:block;width:100%;height:50px;border-radius:25px;margin-top:12px;text-align:center;font-size:16px;font-weight:650;background:rgba(255,255,255,.09);border:1px solid var(--ln)}
.btnw.pri{background:linear-gradient(135deg,#ff8d92,var(--ac2));border:0;color:#fff}.btnw.dng{color:var(--ac)}
.pv{padding:4px 0 2px}.pv .big{font-size:36px;margin:0}.pv .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:16px}
.pv .kv span{color:var(--mu)}.pv .kv b{font-weight:600;text-align:right;min-width:0}
.pv .note{font-size:13px;color:var(--mu);line-height:1.4;margin-top:10px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 18px;border-radius:22px;background:rgba(30,30,36,.96);border:1px solid var(--ln);font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

#pages{position:fixed;inset:0}
#sheets{position:fixed;inset:0;pointer-events:none}
/* ---------- кнопка відправлення ---------- */
#send{position:fixed;left:0;top:0;z-index:32;width:38px;height:38px;border-radius:19px;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ff8d93,#ff454f);box-shadow:0 2px 10px rgba(255,69,79,.4),inset 0 1px 0 rgba(255,255,255,.35);opacity:0;pointer-events:none;transition:opacity .2s,filter .2s;transform:translate3d(-100px,-100px,0)}
#send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#send.show{opacity:1;pointer-events:auto}
#send.show.empty{opacity:.5;filter:saturate(.35)}
#send:active{filter:brightness(.9)}
/* ---------- екран завантаження ---------- */
#boot{position:fixed;inset:0;width:var(--sw,auto);height:var(--sh,auto);z-index:15;background:#050507}
#boot .bwrap{position:absolute;left:50%;top:46%;width:0;height:0}
#boot .bglow{position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;opacity:0;transform:scale(var(--gs,1));
 background:radial-gradient(circle,rgba(255,236,236,1) 0,rgba(255,52,52,1) 9%,rgba(255,0,24,.9) 19%,rgba(235,0,22,.42) 40%,rgba(200,0,18,0) 68%);mix-blend-mode:screen;
 animation:bGlowIn 1.2s ease-out .5s forwards;transition:opacity .3s}
#boot .bglow::after{content:"";position:absolute;left:-70px;top:-70px;right:-70px;bottom:-70px;border-radius:50%;background:radial-gradient(circle,rgba(255,0,24,.6),rgba(255,0,24,0) 62%);filter:blur(18px)}
#boot .brays{position:absolute;left:-270px;top:-270px;width:540px;height:540px;border-radius:50%;pointer-events:none;opacity:var(--ro,0);transform:scale(var(--rs,1)) rotate(var(--rr,0deg));
 background:repeating-conic-gradient(from 0deg,rgba(255,34,44,.65) 0deg 2.2deg,rgba(255,34,44,0) 2.2deg 10deg);mix-blend-mode:screen;filter:blur(1.2px);
 -webkit-mask-image:radial-gradient(circle,transparent 0,transparent 15%,#000 22%,rgba(0,0,0,.5) 42%,transparent 68%);mask-image:radial-gradient(circle,transparent 0,transparent 15%,#000 22%,rgba(0,0,0,.5) 42%,transparent 68%)}
#boot .bring{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;opacity:0;
 box-shadow:0 0 0 2px rgba(255,90,90,.95),0 0 16px 6px rgba(255,20,30,.95),0 0 56px 20px rgba(255,0,20,.62),0 0 140px 44px rgba(220,0,20,.32)}
#boot .blogo{position:absolute;left:-58px;top:-58px;width:116px;height:116px;border-radius:26px;overflow:hidden;opacity:1;transform:scale(2.4);will-change:transform;
 box-shadow:0 0 0 1px rgba(255,255,255,.1)}
#boot.lit .blogo{box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 36px rgba(255,70,80,.4);transition:box-shadow .7s ease-out}
#boot .blogo img{display:block;width:100%;height:100%}
#boot .bbar{display:none}
/* смуга біля краю скла: вміст там малює шейдер із заломленням, тому живий DOM біля краю прозорий */
.rim{-webkit-mask-image:linear-gradient(to right,transparent 14px,#000 30px,#000 calc(100% - 30px),transparent calc(100% - 14px)),linear-gradient(to bottom,transparent 14px,#000 30px,#000 calc(100% - 30px),transparent calc(100% - 14px));-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 14px,#000 30px,#000 calc(100% - 30px),transparent calc(100% - 14px)),linear-gradient(to bottom,transparent 14px,#000 30px,#000 calc(100% - 30px),transparent calc(100% - 14px));mask-composite:intersect}
#boot.gx .brays,#boot.gx .bglow{display:none!important}
#boot .bwrap.p2 .bglow{opacity:0;transition:opacity .12s}
#boot.ba .bglow,#boot.ba .brays{opacity:0!important}
#boot .bwrap.p1 .bglow,#boot .bwrap.p1 .brays{opacity:0!important}
#boot .bwrap.p1 .blogo,#boot .bwrap.p2 .blogo{opacity:0}
#boot .bwrap.p1 .bbar,#boot .bwrap.p2 .bbar{opacity:0}
/* перший кадр = заставка iOS (apple-touch-startup-image): логотип одразу великий, потім плавно зменшується до звичного розміру. Значення 2.4 має збігатися з tools/make-splash.ps1 */
@keyframes bGlowIn{from{opacity:0}to{opacity:.85}}
@keyframes bBarIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot .blogo,#boot .bglow,#boot .bbar{animation-duration:.01s}}
/* ---------- скляні вікна (налаштування, форми, підтвердження) ---------- */
#sheets{z-index:29}
.sheet{position:fixed;left:0;top:0;display:none;color:#fff;border-radius:62px;overflow:hidden;will-change:transform,opacity;pointer-events:auto;touch-action:pan-y}
.sheet .sbody{height:100%;margin:0;max-width:none;border:0;border-radius:0;background:none;max-height:none;padding:26px 28px 28px;overflow-y:auto;overscroll-behavior:contain}
.sheet.ghost .sbody{visibility:hidden}

/* ---------- розмиття й тінь по краю екрана під вікнами ---------- */
#edge{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;
 box-shadow:inset 0 0 90px 14px rgba(0,0,0,.28);
 -webkit-mask-image:linear-gradient(to right,#000,transparent 12%,transparent 88%,#000),linear-gradient(to bottom,#000,transparent 8%,transparent 92%,#000);
 mask-image:linear-gradient(to right,#000,transparent 12%,transparent 88%,#000),linear-gradient(to bottom,#000,transparent 8%,transparent 92%,#000)}

/* ---------- безкінечна сторінка: легке розмиття під статус-баром ---------- */
#topblur{position:fixed;left:0;right:0;top:0;height:max(76px,calc(env(safe-area-inset-top,0px) + 30px));z-index:21;pointer-events:none;
 background:linear-gradient(to bottom,rgba(5,5,7,.34),rgba(5,5,7,0));
 
 -webkit-mask-image:linear-gradient(to bottom,#000 35%,transparent);mask-image:linear-gradient(to bottom,#000 35%,transparent)}
/* ---------- бігуча строка курсів ---------- */
#ticker{position:fixed;z-index:22;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 8px);height:56px;border-radius:28px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:rgba(8,8,11,.6);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .5s}
#ticker.on{opacity:1}
#ticker .trk{display:flex;align-items:center;width:max-content;height:100%;will-change:transform}
#ticker .ti{display:flex;align-items:center;gap:12px;padding:0 16px;white-space:nowrap;border-left:1px solid var(--ln)}
#ticker .tc b{display:block;font-size:14px;font-weight:650;line-height:1.15}
#ticker .tp{display:flex;gap:7px;align-items:baseline;font-size:13px;line-height:1.2;margin-top:2px}
#ticker .tp i{font-style:normal;font-size:12px;font-weight:600;color:var(--gr)}#ticker .tp i.neg{color:var(--ac)}
#ticker .sp{flex:none;display:block}
#ticker .tmsg{display:flex;align-items:center;height:100%;padding:0 20px;font-size:14px;color:var(--mu);white-space:nowrap}
/* ---------- вибір курсів у налаштуваннях ---------- */
.mkinfo{font-size:13px;line-height:1.45;color:var(--mu);padding:2px 2px 8px}
.mkinfo b{color:#fff;font-weight:600}
.mkh{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:12px 2px 2px}
.mkr{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border-bottom:1px solid var(--ln)}
.mkr .t{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkr .d{font-size:13px;color:var(--mu);white-space:nowrap}
.mkr .sw{display:block}

/* ---------- скляні віджети (шар #glt малює скло; тут лише прозорий фон) ---------- */
#glt{position:fixed;left:0;top:0;width:100%;height:var(--appH,100%);z-index:-1;pointer-events:none;display:none}
.gt .tile{background:none;border-color:rgba(255,255,255,.05)}
.gt .tile.bal.up{border-color:rgba(90,220,150,.12)}
.gt .tile.bal.dn{border-color:rgba(255,125,131,.12)}
.gt .mini,.gt .split>button{background:none}
.gt .srch{background:none;border-color:transparent}

/* ---------- сторінка пари ---------- */
.mchart{position:relative;height:210px;margin:12px 0 6px;touch-action:none}
.mchart svg{position:absolute;left:0;top:0;width:100%;height:100%}
.mchart .mx,.mchart .mn{position:absolute;left:0;font-size:12px;font-weight:600;color:var(--mu)}
.mchart .mx{top:0}.mchart .mn{bottom:0}
.mchart .msg{position:absolute;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;font-size:14px;color:var(--mu)}
.mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:12px}
.mper{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:17px;font-size:13px;font-weight:600;color:var(--mu);border:1px solid var(--ln)}
.chip.on{color:#fff;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2)}
#mcross{position:fixed;z-index:23;left:0;top:0;width:0;display:none;pointer-events:none}
#mcross i{position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
#mcross b{position:absolute;top:-30px;transform:translateX(-50%);padding:5px 10px;border-radius:12px;background:rgba(20,20,26,.92);border:1px solid var(--ln);font-size:12px;font-weight:600;white-space:nowrap}

/* у застосунку з іконки всі повноекранні шари й док прив'язані до фактичної висоти екрана (screen.height), щоб унизу не лишалось смуги */
#bg,#pages,#sheets,#scrim,#edge,#menuShade{height:var(--appH,auto)}
#dock{top:var(--dockTop,auto)}

/* iOS «урізав» вікно (svh < lvh): документ висотою lvh, повноекранні шари й док — absolute, щоб малювались і в нижній смузі */
html.lv,html.lv body{height:var(--appH)}
html.lv #bg,html.lv #glt,html.lv #pages,html.lv #boot,html.lv #scrim,html.lv #edge,html.lv #menuShade,html.lv #dock,html.lv #gl{position:absolute}
/* вкладене скло: кнопки «Доходи/Витрати», міні-картки, круглі значки стрілок */
.gt .split>button{border-color:rgba(255,255,255,.06)}
.gt .dot.up,.gt .dot.dn{background:none}

/* ---------- скляні лінії графіків і прогрес-бари: малює WebGL-шар плиток (html.glines.gt). Вимкнення — у Налаштуваннях ---------- */
html.glines.gt .bar i,html.glines.gt .cat .b i{background:transparent!important}
html.glines.gt .bar,html.glines.gt .cat .b{background:transparent!important;box-shadow:none!important}

/* скляні значки з літерою і кнопки сортування / «+ Борг»: скло малює шар плиток */
.gt .page .ic{background:none!important}
.gt .page .pillb{background:none;border-color:rgba(255,255,255,.07)}
.page .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

/* тікер на всю ширину: скло з виворотними закругленнями до країв екрана малює шар плиток; вміст сторінок зникає під тікером */
.gt #ticker{left:16px;right:16px;border-radius:28px;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.gt #topblur{display:none}

/* скло тікера малює головне полотно (#gl) поверх віджетів; коли відкрита панель, полотно вище тікера — тікер просто темніє */
.gt.fm #ticker{background:rgba(8,8,11,.78)}

/* баланс: число зліва, графік справа; доходи/витрати внизу */
.brow{display:flex;align-items:flex-end;gap:12px;margin-top:2px}
.brow .bl{flex:1 1 0;min-width:0}
.brow .spark{flex:0 0 40%;width:40%;height:64px;margin:0 0 2px}
.brow .chg{flex-wrap:wrap;line-height:1.25}
.big,.mid,.split b,.mini b{overflow:hidden;max-width:100%}
.big{padding-bottom:2px}
.split>button{text-align:left}
.split>button>div{min-width:0;flex:1}
.split>button[data-v=income] b{color:var(--gr)}
.split>button[data-v=expense] b{color:var(--ac)}
/* значки з літерою: літера строго по центру кола */
.ic,.dot{line-height:1;padding:0;text-indent:0;letter-spacing:0;box-sizing:border-box}
.ic{display:grid;place-items:center}
.dot{display:grid;place-items:center}
/* значки у панелі «Додатково» і вікнах — скляні (знімок DOM, тому імітація скла стилем) */
#menu .ic,#sheets .ic{background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.2),rgba(255,255,255,.04) 62%)!important;
 box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 0 14px -2px currentColor,inset 0 -4px 7px rgba(0,0,0,.28),inset 0 3px 5px rgba(255,255,255,.07)}

/* баланс за еталоном: рядок число + графік зі стрілкою; доходи/витрати без рамок, з роздільником */
.chg{font-size:15px;font-weight:700;line-height:1.3;margin-top:8px}
.chg span{display:block;margin:0;color:inherit;font-weight:500;font-size:14px;opacity:.9}
.brow .chw{flex:0 0 42%;width:42%;height:64px;display:flex;align-items:center;gap:3px;min-width:0}
.brow .chw .spark{flex:1 1 0;width:0;min-width:0;height:64px}
.chev{font-style:normal;color:var(--mu);font-size:20px;line-height:1;flex:none}
.split{align-items:stretch;gap:10px}

.split .vd{display:none}
/* рахунки: підпис і ряд скляних іконок-застосунків */
.accs{position:relative;padding:2px 2px 0}
.tile.accs{padding:16px 14px 14px}
.accs .th{margin-bottom:2px}
.accs .th h2{font-size:17px;font-weight:600;color:var(--mu);letter-spacing:0}
.arow{display:flex;flex-wrap:wrap;gap:14px 10px;margin-top:8px}
.ab{flex:0 0 calc((100% - 40px)/5);display:flex;flex-direction:column;align-items:center;min-width:0;gap:4px;background:none;border:0;padding:0;color:inherit}
.aic{width:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:30%;font-size:26px;font-weight:700;font-style:normal;line-height:1;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid var(--ln)}
.aic.plus{color:#9a9aa5}
.an{font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an.mu{color:var(--mu)}
.aa{font-size:11.5px;font-weight:600;color:var(--gr);max-width:100%;overflow:hidden;white-space:nowrap}
.aa.neg{color:var(--ac)}
.gt .page .aic{background:none;border-color:rgba(255,255,255,.06)}

#menu .ic,#sheets .ic{filter:saturate(var(--cgs,1))brightness(var(--cgb,.9))}
input[type=range]{width:100%;accent-color:#7cc}

#ticker.tkgl>*{opacity:0}

.brow .chw{padding:6px 8px 6px 10px;border-radius:20px;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid var(--ln)}
.gt .brow .chw{background:none;border-color:rgba(255,255,255,.06)}

textarea[data-sy]{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:14px;color:inherit;font:13px/1.35 ui-monospace,Menlo,monospace;padding:10px;resize:none}

#dock.dkc #btns{opacity:0}

/* значки у «Додатково» — той самий вигляд, що й скляні значки в операціях */
#menu .ic,#sheets .ic{background:color-mix(in srgb,currentColor 17%,rgba(255,255,255,.035))!important;border:1px solid rgba(255,255,255,.09);box-sizing:border-box;
 box-shadow:inset 0 1px 1px rgba(255,255,255,.2),inset 0 -2px 6px rgba(0,0,0,.4),inset 0 0 10px -2px color-mix(in srgb,currentColor 35%,transparent)}

/* вміст під склом малює шейдер: текст у DOM ховається (значки, стрілки, підписи кнопок) */
.gt .gxh{-webkit-text-fill-color:transparent}
.brow .chw{height:54px;padding:4px 8px 4px 10px}
.brow .chw .spark{height:36px}

/* стрілки й літери в кружечках лишаються поверх скла без заломлення */
.gt .gxh .dot,.gt .gxh .ic{-webkit-text-fill-color:currentColor}
.gt .gxh svg.spark{opacity:0}

.brow .chw{display:block;flex:0 0 40%;width:40%;padding:4px 0}
.brow .chw .spark{display:block;width:100%;height:36px;flex:none}
.brow .chev{align-self:center;margin-left:2px}

#fglow{position:fixed;left:0;top:0;width:100%;height:100%;z-index:18;pointer-events:none;mix-blend-mode:screen}

#fglow{display:none!important}

/* скляні кнопки (налаштування, «Додатково», вікна): скло малює шейдер головного полотна; DOM дає лише текст */
#sheets .btnw,#menu .gbtn{background:none!important;border:0!important;box-shadow:none!important;color:#fff}
#sheets .btnw:active,#menu .gbtn:active{filter:brightness(1.3)}
#menu .gbtn{display:block;width:calc(100% - 8px);margin:10px 4px 2px;height:46px;border-radius:23px;font-size:15px;font-weight:650;text-align:center}
.cw{padding:6px 4px 2px;text-align:center}.cw h3{margin:4px 0 8px;font-size:20px}.cw p{margin:0 4px 14px;color:var(--mu);font-size:14px;line-height:1.4}
.cwr{display:flex;gap:10px}.cwr .btnw{flex:1;margin-top:0;font-size:15px}

.tools.tpl{display:flex;flex-wrap:wrap;gap:8px;padding:0 2px}
.fr select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--ln);border-radius:12px;color:#fff;font:inherit;padding:10px}

/* пасхалка: маленька крапля внизу кожної сторінки */
.egg{display:flex;justify-content:center;padding:22px 0 30px}
.eggd{width:13px;height:13px;padding:0;margin:0;border:1px solid rgba(255,255,255,.28);border-radius:0 50% 50% 50%;transform:rotate(45deg);background:radial-gradient(circle at 62% 62%,rgba(255,255,255,.5),rgba(255,255,255,.06) 70%);box-shadow:0 0 10px rgba(255,255,255,.12);opacity:.55;-webkit-tap-highlight-color:transparent;cursor:pointer}
.eggd:active{opacity:.9}

/* налаштування: розділи і повзунки (підпис зверху, повзунок на всю ширину під ним) */
.sec2{font-size:12px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:22px 4px 6px}
.fr.rng{display:block;min-height:0;padding:10px 0 12px}
.fr.rng>label{display:block;font-size:14px;margin-bottom:9px}

/* утримання пальця (хвиля, від'єднання віджета) не виділяє текст і не відкриває системне меню; поля вводу виділяються як звичайно */

/* ---------- адаптивні віджети: кожна плитка сітки — контейнер; шрифти тягнуться плавно, а коли тісно — другорядне ховається ---------- */
.inner.g4>.tile{container-type:inline-size;min-width:0}
.inner.g4>.tile .big{font-size:clamp(17px,12.5cqi,40px)}

@container (max-width:260px){
 .split{flex-direction:column;gap:8px}.split>button{padding:9px}

 .brow{flex-direction:column;align-items:stretch;gap:6px}.brow .chw{width:100%;flex-basis:auto}

}
@container (max-width:180px){

}

}
/* віджети зі списку */
.wrow{display:flex;align-items:center;gap:12px;margin-top:8px}.wtx{min-width:0;flex:1}.wtx .mid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var MONTHS_UA=['січ','лют','бер','квіт','трав','черв','лип','серп','вер','жовт','лист','груд'];
function nlQuery(q){
 var x=String(q||'').toLowerCase().replace(/[’'?!.,]/g,' ');if(!/(скільки|сколько|how much|ile)/.test(x))return null;
 var now=new Date(),y=now.getFullYear(),m=now.getMonth(),label='цього місяця',found=false;
 if(/минул|прошл|last month/.test(x)){m--;if(m<0){m=11;y--;}label='минулого місяця';found=true;}
 MONTHS_UA.forEach(function(st,i){if(!found&&new RegExp('(^|\\s)'+st).test(x)&&!/^скільк/.test(st)){m=i;if(i>now.getMonth())y=now.getFullYear()-1;else y=now.getFullYear();label='у '+['січні','лютому','березні','квітні','травні','червні','липні','серпні','вересні','жовтні','листопаді','грудні'][i];found=true;}});
 var all=/за весь час|загалом|всього|усього/.test(x);if(all)label='за весь час';
 var inc=/зароб|дохід|доход|отрим/.test(x);
 var stop=/^(скільки|сколько|я|на|за|в|у|у|витратив|витратила|витрачено|потратив|грошей|було|цього|минулого|місяця|місяці|весь|час|зароб\S*|отрим\S*|дохід|доходу|how|much|ile|for|on|in|загалом|всього|усього)$/;
 var words=x.split(/\s+/).filter(function(w){return w&&!stop.test(w)&&!MONTHS_UA.some(function(st){return w.indexOf(st)===0;});});
 var stems=words.map(function(w){return VF.foldText(w).slice(0,Math.max(3,Math.min(5,w.length-1)));});
 var a=all?new Date(0):new Date(y,m,1),b=all?new Date(8.64e15):new Date(y,m+1,1),sum=0,list=[];
 fin.getState().transactions.forEach(function(t){if(t.type!==(inc?'income':'expense'))return;var dt=new Date(t.date);if(dt<a||dt>=b)return;
  var hay=VF.foldText([t.note,t.client,catName(t.category)].join(' '));if(stems.length&&!stems.every(function(st){return hay.indexOf(st)>=0;}))return;sum+=t.amount;list.push(t);});
 return{sum:sum,list:list,label:label,what:words.join(' '),inc:inc};
}

var WG_LIST=[
 {id:'clock',n:'Годинник і дата',s:2},{id:'today',n:'Можна витратити сьогодні',s:2},{id:'save',n:'Заощадження місяця',s:2},{id:'focus',n:'Головна витрата місяця',s:2},
 {id:'week',n:'Витрати за тиждень',s:4},{id:'upc',n:'Найближчі платежі',s:4},{id:'debt',n:'Хто винен',s:4},{id:'pair',n:'Курс валюти',s:2},
 {id:'pay',n:'Днів до доходу',s:2},{id:'quick',n:'Швидка операція',s:2},{id:'notes',n:'Нотатки',s:4},{id:'game',n:'Успіх',s:2}];
var WG=(function(){try{var j=JSON.parse(localStorage.getItem('vf-wg')||'null');if(Array.isArray(j))return j;}catch(e){}return WG_LIST.map(function(w){return w.id;});})();
function wgSave(){try{localStorage.setItem('vf-wg',JSON.stringify(WG));}catch(e){}}
function wgToggle(id){var i=WG.indexOf(id);if(i>=0)WG.splice(i,1);else WG.push(id);wgSave();renderPages();}
function wgLabel(w){return w.n+': '+(WG.indexOf(w.id)>=0?'показано':'сховано');}
function wgRing(p,col){p=Math.max(0,Math.min(100,p));return'<div class="wpb"><b>'+Math.round(p)+'%</b><div class="bar"><i style="width:'+p.toFixed(1)+'%;background:'+col+'" data-col="'+col+'"></i></div></div>';}   /* частка — скляний прогрес-бар */
function wgDay(d){return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();}
function wgNextDay(day){var n=new Date(),d=new Date(n.getFullYear(),n.getMonth(),Math.min(day,28)),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(d<t)d=new Date(n.getFullYear(),n.getMonth()+1,Math.min(day,28));return{d:d,left:Math.round((d-t)/864e5)};}
function wgBlocks(){
 var st=fin.getState(),now=new Date(),o=[],ms=new Date(now.getFullYear(),now.getMonth(),1);
 function mon(type){var s=0;st.transactions.forEach(function(t){if(t.type===type&&t.currency==='PLN'&&new Date(t.date)>=ms)s+=t.amount;});return s;}
 WG.forEach(function(id){var w=WG_LIST.find(function(q){return q.id===id;});if(!w)return;var c='tile wg wg-'+id+(w.s===2?' ws2':''),h='';
  if(id==='clock'){h='<div class="lbl">Зараз</div><div class="big wclk" data-clk="1">'+now.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})+'</div><div class="cap">'+esc(todayStr())+'</div>';}
  else if(id==='today'){var fc=forecastMonth(),left=Math.max(1,fc.left+1),rest=fc.limit-fc.spent,per=rest/left;
   h='<div class="lbl">Можна сьогодні</div><div class="big" style="color:'+(per<0?'var(--ac)':'var(--gr)')+'">'+esc(money(Math.max(0,per)))+'</div><div class="bar"><i style="width:'+Math.min(100,fc.limit?fc.spent/fc.limit*100:0).toFixed(1)+'%"></i></div><div class="cap">Залишок ліміту '+esc(money(rest))+' на '+left+' дн.</div>';}
  else if(id==='save'){var inc=mon('income'),exp=mon('expense'),sv=inc-exp,p=inc>0?sv/inc*100:0;
   h='<div class="lbl">Заощаджено цього місяця</div><div class="wrow">'+wgRing(p,p>=0?'#66d896':'#ff7d83')+'<div class="wtx"><div class="mid" style="color:'+(sv<0?'var(--ac)':'var(--gr)')+'">'+esc(mv(sv))+'</div><div class="cap">від доходу '+esc(money(inc))+'</div></div></div>';}
  else if(id==='focus'){var by={},tot=0,top=null;st.transactions.forEach(function(t){if(t.type==='expense'&&t.currency==='PLN'&&new Date(t.date)>=ms){by[t.category]=(by[t.category]||0)+t.amount;tot+=t.amount;}});
   for(var k in by)if(!top||by[k]>by[top])top=k;
   h=top?'<div class="lbl">Найбільше на</div><div class="wrow">'+wgRing(by[top]/tot*100,hashCol(top))+'<div class="wtx"><div class="mid">'+esc(catName(top))+'</div><div class="cap">'+esc(money(by[top]))+' цього місяця</div></div></div>':'<div class="lbl">Найбільше на</div><div class="empty">Витрат ще немає</div>';}
  else if(id==='week'){var days=[],mx=1,i;for(i=6;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);days.push({d:d,k:wgDay(d),s:0});}
   st.transactions.forEach(function(t){if(t.type!=='expense'||t.currency!=='PLN')return;var k=wgDay(new Date(t.date));days.forEach(function(q){if(q.k===k)q.s+=t.amount;});});
   days.forEach(function(q){mx=Math.max(mx,q.s);});var sum=days.reduce(function(a,q){return a+q.s;},0);
   h='<div class="th"><h2>Витрати за тиждень</h2><span class="lbl">'+esc(money(sum))+'</span></div><div class="wbars">'+days.map(function(q){return'<div class="wb"><span class="bar wv"><i style="height:'+(q.s/mx*100).toFixed(1)+'%;width:100%"></i></span><em>'+['Нд','Пн','Вт','Ср','Чт','Пт','Сб'][q.d.getDay()]+'</em></div>';}).join('')+'</div>';}
  else if(id==='upc'){var rc=(st.recurring||[]).map(function(r){var nx=wgNextDay(r.day);return{r:r,n:nx};}).sort(function(a,b){return a.n.left-b.n.left;}).slice(0,3);
   h='<div class="th"><h2>Найближчі платежі</h2><button data-act="recurring">Усі</button></div>'+(rc.length?rc.map(function(q,i){var r=q.r;return'<div class="row'+(i?'':' first')+'">'+icon(r.name,hashCol(r.category))+'<div class="rc"><b>'+esc(r.name)+'</b><span>'+(q.n.left===0?'сьогодні':q.n.left===1?'завтра':'через '+q.n.left+' дн.')+'</span></div><em class="'+(r.type==='income'?'in':'')+'">'+(r.type==='income'?'+':'−')+esc(money(r.amount,r.currency))+'</em></div>';}).join(''):'<div class="empty">Повторюваних платежів ще немає.</div>');}
  else if(id==='debt'){var g=fin.debtGroups({}),rv=(g.find(function(x){return x.key==='receivable';})||{items:[]}).items.filter(function(d){return!d.paid;}).slice(0,3),dt=fin.debtTotals();
   h='<div class="th"><h2>Мені винні</h2><button data-act="debts">'+esc(money(dt.receivable))+'</button></div>'+(rv.length?rv.map(function(d,i){return debtRow(d,i===0);}).join(''):'<div class="empty">Ніхто нічого не винен.</div>');}
  else if(id==='pair'){var pid=(MK.selection||[])[0],m=pid&&MK.data[pid];
   h='<div class="lbl">'+esc(m?m.label:'Курс')+'</div>'+(m&&isFinite(m.value)?'<div class="big">'+esc(mkFmt(m.value))+'</div><div class="chg '+(m.change<0?'neg':'')+'">'+esc(mkPct(m.change))+'<span>'+esc(mkSource(m))+'</span></div>':'<div class="empty">Курс завантажується</div>');}
  else if(id==='pay'){var ri=(st.recurring||[]).filter(function(r){return r.type==='income';}).map(function(r){return{r:r,n:wgNextDay(r.day)};}).sort(function(a,b){return a.n.left-b.n.left;})[0];
   h='<div class="lbl">До доходу</div>'+(ri?'<div class="big">'+ri.n.left+' дн.</div><div class="cap">'+esc(ri.r.name)+' · '+esc(money(ri.r.amount,ri.r.currency))+'</div>':'<div class="empty">Додайте повторюваний дохід</div>');}
  else if(id==='quick'){var tp=(st.templates||[])[0];
   h='<div class="lbl">Швидка операція</div>'+(tp?'<button class="mini wq" data-act="tpl" data-id="'+esc(tp.id)+'"><b>'+esc(tp.name)+'</b><span class="lbl">'+esc(money(tp.amount,tp.currency))+'</span></button>':'<button class="mini wq" data-act="wnew"><b>+ Операція</b><span class="lbl">новий запис</span></button>');}
  else if(id==='notes'){h='<div class="th"><h2>Нотатки</h2></div><textarea class="wnotes" data-notes="1" rows="4" placeholder="Що не забути…"></textarea>';}
  else if(id==='game'){h='<button data-act="game" style="display:block;width:100%;text-align:left"><div class="lbl">Мінігра</div><div class="mid">Успіх ↗</div><div class="cap">Торгівля, що завжди в плюс</div></button>';}
  o.push(B_(c,h));});
 return o;
}

/* Причина збоїв запуску на iPhone (за діагностикою): iOS у застосунку з іконки інколи лишає сторінку «прокрученою» на висоту статус-бару (scrollY=-62, visualViewport.offsetTop=-62).
   Тоді getBoundingClientRect() закріплених елементів зсунутий на +62 відносно того, де вони намальовані: скло дока опинялось нижче кнопок, крапля вилітала нижче логотипа.
   Тому: 1) повертаємо scroll у 0; 2) усі виміри закріплених елементів ідуть через frect(), яка компенсує зсув; 3) безпечні зони читаються наживо. */

/* ===== 8. Сторінка пари: детальний графік за вибраний період (1 год … 5 років) =====
   Джерела ті самі, що й у тікера: Frankfurter (валюти, щоденні курси ЄЦБ) і Kraken (крипто, свічки OHLC).
   Для валют годинних даних у джерела немає, тому періоди «1 год» і «1 день» є лише в крипто. */
var MKP_FX=['7D','1M','3M','1Y','5Y'],MKP_CR=['1H','1D','7D','1M','3M','1Y','5Y'];
var MKP_L={'1H':'1 год','1D':'1 день','7D':'7 днів','1M':'1 міс','3M':'3 міс','1Y':'1 рік','5Y':'5 років'};
var MKP_DAYS={'7D':7,'1M':30,'3M':91,'1Y':365,'5Y':1826};
var MKP_KR={'1H':[1,3600000],'1D':[5,86400000],'7D':[60,604800000],'1M':[240,2592000000],'3M':[1440,7776000000],'1Y':[1440,31536000000],'5Y':[10080,157680000000]};
var mkpCache={},mkP={id:'',period:'1M',pts:null,draw:null,state:'idle'},mkpReq=0,mcrossEl=document.getElementById('mcross');

function mkMeta(id){var c=VF.marketCatalog();for(var i=0;i<c.length;i++)if(c[i].id===id)return c[i];return null;}
function mkPeriods(m){return m&&m.kind==='crypto'?MKP_CR:MKP_FX;}
function mkJson(url){return fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
function mkLoadSeries(m,period){
 var now=Date.now(),key=m.id+'|'+period,c=mkpCache[key];
 if(c&&now-c.t<(m.kind==='crypto'?60000:3600000))return Promise.resolve(c.pts);
 var p;
 if(m.kind==='fx'){
  var all=mkpCache[m.id+'|fx5y'];
  if(all&&now-all.t<3600000)p=Promise.resolve(all.pts);
  else{
   var f=new Date(now);f.setFullYear(f.getFullYear()-5);
   p=mkJson('https://api.frankfurter.dev/v2/rates?from='+f.toISOString().slice(0,10)+'&base='+m.base.toLowerCase()+'&quotes='+m.quote.toLowerCase()).then(function(rows){
    var pts=rows.map(function(r){return{t:Date.parse(r.date),v:Number(r.rate)};}).filter(function(x){return isFinite(x.v)&&isFinite(x.t);});
    mkpCache[m.id+'|fx5y']={t:now,pts:pts};return pts;});
  }
  p=p.then(function(pts){
   var from=now-MKP_DAYS[period]*86400000,i=0;while(i<pts.length&&pts[i].t<from)i++;
   return pts.slice(Math.max(0,i-1));});
 }else{
  var cfg=MKP_KR[period];
  p=mkJson('https://api.kraken.com/0/public/OHLC?pair='+m.pair+'&interval='+cfg[0]+'&since='+Math.floor((now-cfg[1])/1000)).then(function(res){
   if(res.error&&res.error.length)throw new Error(res.error[0]);
   var rows=[],k,r=res.result||{};for(k in r)if(Array.isArray(r[k])){rows=r[k];break;}
   return rows.map(function(x){return{t:x[0]*1000,v:Number(x[4])};}).filter(function(x){return isFinite(x.v);});});
 }
 return p.then(function(pts){mkpCache[key]={t:Date.now(),pts:pts};return pts;});
}

}

/* ---------- синхронізація між пристроями: шифрований код (AES-256-GCM, PBKDF2) ---------- */
var SYE=new TextEncoder(),SYD=new TextDecoder();
function syGetKey(){try{return localStorage.getItem('vf-synckey')||'';}catch(e){return'';}}
function sySetKey(k){try{localStorage.setItem('vf-synckey',k);}catch(e){}}
function b64u(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function syKeyFrom(pass,salt){return crypto.subtle.importKey('raw',SYE.encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
function syEncrypt(pass,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 return syKeyFrom(pass,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,SYE.encode(JSON.stringify(obj)));}).then(function(ct){return'VFSYNC1.'+b64u(salt)+'.'+b64u(iv)+'.'+b64u(new Uint8Array(ct));});}
function syDecrypt(pass,code){var p=String(code).trim().split('.');if(p[0]!=='VFSYNC1'||p.length!==4)return Promise.reject(new Error('Це не код синхронізації'));
 return syKeyFrom(pass,unb64u(p[1])).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(p[2])},k,unb64u(p[3]));}).then(function(pt){return JSON.parse(SYD.decode(pt));},function(){throw new Error('Невірний ключ або код пошкоджено');});}
function syField(n){var e=curSheet&&curSheet.body.querySelector('[data-sy="'+n+'"]');return e?e.value:'';}
function syNeedKey(){var k=syField('key').trim().toUpperCase();if(k.length<8){toast('Спершу введіть або створіть ключ (мінімум 8 символів)');return'';}sySetKey(k);return k;}
function syGen(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16)),k='';for(var i=0;i<16;i++){k+=A[r[i]%32];if(i%4===3&&i<15)k+='-';}
 var e=curSheet.body.querySelector('[data-sy="key"]');if(e)e.value=k;sySetKey(k);sheetStale();toast('Ключ створено. Збережіть його: на інших пристроях введіть такий самий');}
function syExport(){var k=syNeedKey();if(!k)return;var st=fin.getState();
 syEncrypt(k,{app:'voice-finance-glass',v:1,at:new Date().toISOString(),data:{transactions:st.transactions,debts:st.debts,accounts:st.accounts,categories:st.categories,balanceSnapshots:st.balanceSnapshots}}).then(function(code){
  LG('sync','експорт, символів '+code.length);
  if(navigator.share){navigator.share({text:code,title:'Voice Finance — код синхронізації'}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){toast('Код скопійовано');},function(){toast('Не вдалося скопіювати');});}
 }).catch(function(e){toast('Помилка шифрування: '+(e.message||e));});}
function syImport(mode){var k=syNeedKey();if(!k)return;var code=syField('code');if(!code.trim()){toast('Вставте код з іншого пристрою');return;}
 syDecrypt(k,code).then(function(o){if(!o||o.app!=='voice-finance-glass'||!o.data)throw new Error('Невідомий формат коду');
  var r=fin.importSnapshot(o.data,{mode:mode});LG('sync','імпорт '+mode+' '+JSON.stringify(r));
  toast(mode==='merge'?'Додано: операцій '+r.transactions+', боргів '+r.debts+', рахунків '+r.accounts:'Дані замінено: операцій '+r.transactions);
 }).catch(function(e){toast(e.message||String(e));});}

var PRS=new Map(),PRraf=0,PRlast=0,PRd=null;

function prStep(t){
 PRraf=0;var dt=Math.min(.033,Math.max(.001,(t-PRlast)/1000)),sg=0;PRlast=t;

  dn={b:b,x:e.clientX,y:e.clientY};clearTimeout(tm);
  tm=setTimeout(function(){if(!dn)return;var d=dn;dn=null;WF.sup=1;setTimeout(function(){WF.sup=0;},600);wfDetach(d.b,d.x,d.y);},520);});
 root.addEventListener('pointermove',function(e){if(dn&&Math.hypot(e.clientX-dn.x,e.clientY-dn.y)>8){clearTimeout(tm);dn=null;}});
 ['pointerup','pointercancel'].forEach(function(n){root.addEventListener(n,function(){clearTimeout(tm);dn=null;});});
 /* жести на від'єднаному віджеті: перетягування, кидок, подвійний тап; кнопки всередині неактивні */
 window.addEventListener('pointerdown',function(e){if(BH.ph)return;var w=wfFind(e.target);if(!w)return;e.stopPropagation();if(e.cancelable)e.preventDefault();
  var now=performance.now();if(now-w.lt<320&&Math.hypot(e.clientX-w.lx,e.clientY-w.ly)<30){w.home=1;w.lt=0;WF.drag=null;LG('egg','подвійний тап — віджет додому');wfKick();return;}
  WFcur=w;w.lt=now;w.lx=e.clientX;w.ly=e.clientY;w.home=0;WF.drag={w:w,x0:e.clientX,y0:e.clientY,dx0:w.dx,dy0:w.dy,lx:e.clientX,ly:e.clientY,lt:now,mv:0};w.vx=w.vy=0;wfKick();},true);
 window.addEventListener('pointermove',function(e){var D=WF.drag;if(!D)return;e.stopPropagation();if(e.cancelable)e.preventDefault();
  var now=performance.now(),w=D.w,dtm=Math.max(1,now-D.lt)/1000,k=Math.min(1,dtm*18);
  w.vx+=((e.clientX-D.lx)/dtm-w.vx)*k;w.vy+=((e.clientY-D.ly)/dtm-w.vy)*k;D.mv+=Math.abs(e.clientX-D.lx)+Math.abs(e.clientY-D.ly);D.lx=e.clientX;D.ly=e.clientY;D.lt=now;
  w.dx=D.dx0+e.clientX-D.x0;w.dy=D.dy0+e.clientY-D.y0;wfKick();},true);
 ['pointerup','pointercancel'].forEach(function(n){window.addEventListener(n,function(e){var D=WF.drag;if(!D)return;e.stopPropagation();WF.drag=null;var w=D.w;
  if(performance.now()-D.lt>90){w.vx*=.2;w.vy*=.2;}var sp=Math.hypot(w.vx,w.vy);if(sp>3000){w.vx*=3000/sp;w.vy*=3000/sp;}
  if(D.mv<6){w.evx-=1.2;w.evy+=1.2;}
  else if(sp<160){try{if(wfSlot(w)){w.home=1;w.vx=w.vy=0;LG('egg','віджет опущено в сітку');}}catch(err){console.error(err);}}   /* повільне відпускання — стає в сітку; кидок — летить */
  wfKick();},true);});
 window.addEventListener('click',function(e){if(WF.sup||wfFind(e.target)){e.stopPropagation();e.preventDefault();}},true);
 ['touchstart','touchmove'].forEach(function(n){window.addEventListener(n,function(e){var t=e.touches[0];if(!t)return;if(WF.drag||(n==='touchstart'&&wfFind(e.target))){if(e.cancelable)e.preventDefault();e.stopPropagation();}},{capture:true,passive:false});});
})();

   жодних викликів finance-core, нічого не зберігається, з балансом застосунку не пов'язаний. */
var GM=null;
function gmFmt(v,d){var a=Math.abs(v),s=a>=1e12?(a/1e12).toFixed(2)+' трлн':a>=1e9?(a/1e9).toFixed(2)+' млрд':a>=1e6?(a/1e6).toFixed(2)+' млн':a.toLocaleString('uk-UA',{minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d});return(v<0?'−':'')+s;}

 return ids.map(function(id){var d=MK.data[id];return{id:id,label:by[id].label,px:d&&isFinite(d.value)&&d.value>0?d.value:null};});}

/* історія: хвилинні свічки випадковим блуканням, що закінчуються на справжній поточній ціні */
function gmHistory(px){var n=2880,c=[],p=px,i;var walk=[p];for(i=0;i<n;i++){p=p/(1+(Math.random()-.5)*.0028);walk.push(p);}walk.reverse();
 for(i=0;i<n;i++){var o=walk[i],cl=walk[i+1],h=Math.max(o,cl)*(1+Math.random()*.0009),l=Math.min(o,cl)*(1-Math.random()*.0009);c.push({o:o,h:h,l:l,c:cl});}return c;}
function gmSetPair(id){var p=gmPairs().find(function(q){return q.id===id;})||gmPairs()[0];if(!p)return;
 var px=p.px||({btc:65000,eth:3200}[String(p.id).toLowerCase().split(/[^a-z]/)[0]]||100);
 GM.pid=p.id;GM.label=p.label;GM.c=gmHistory(px);GM.sub=0;GM.pos=null;GM.real=!!p.px;}
function gmMount(){
 var tries=0;(function wait(){var cv=document.getElementById('gmCv');if(!cv){if(++tries<60)requestAnimationFrame(wait);return;}
  GM={bal:Math.round((4725+Math.random()*(99999-4725))*100)/100,tf:1,mode:'line',amt:25,lev:50,ops:[],pos:null,dirty:1};
  gmSetPair(document.getElementById('gmPair').value);LG('egg','мінігра «Успіх»: баланс гри '+GM.bal+' $');
  clearInterval(gmMount.iv);gmMount.iv=setInterval(gmTick,100);gmDraw();gmUi();})();
}
/* шлях угоди: напрям завжди правильний (лонг вгору, шорт вниз), але висота, тривалість, форма й шум щоразу випадкові —
   то крихітна свічка, то середня, то раптовий великий пробій; всередині шляху бувають відкати, кінець завжди в плюс */
function gmPath(){
 var r=Math.random(),mag,N;
 if(r<.14){mag=.012+Math.random()*.045;N=8+((Math.random()*10)|0);}          /* великий пробій */
 else if(r<.46){mag=.0005+Math.random()*.0013;N=18+((Math.random()*30)|0);}  /* крихітний рух */
 else{mag=.0019+Math.random()*.0065;N=22+((Math.random()*46)|0);}            /* середній */
 var ease=.4+Math.random()*2,amp=mag*(.25+Math.random()*.8),W=[0],s=0,i,p=[];
 for(i=1;i<=N;i++){s+=(Math.random()+Math.random()-1)*2;W.push(s);}
 var t0=.12+Math.random()*.7,w=.05+Math.random()*.12,A=mag*(Math.random()<.55?1:-.7)*Math.random()*.9;
 for(i=0;i<=N;i++){var t=i/N;p.push(mag*Math.pow(t,ease)+amp*1.7*(W[i]-t*W[N])/Math.sqrt(N)+A*Math.exp(-Math.pow((t-t0)/w,2))*(1-t));}
 p[0]=0;p[N]=mag;return{p:p,N:N,mag:mag};
}
function gmTick(){
 var cv=document.getElementById('gmCv');if(!cv||!GM){clearInterval(gmMount.iv);GM=null;return;}
 var last=GM.c[GM.c.length-1],p=last.c,P=GM.pos,np;
 if(P){
  if(P.k<=P.path.N){np=P.entry*(1+P.dir*P.path.p[P.k])*(1+(Math.random()-.5)*.00014);P.k++;}
  else{np=P.entry*(1+P.dir*P.path.mag);var pnl=P.stake*P.lev*P.path.mag;GM.bal+=pnl;
   GM.ops.unshift({side:P.dir>0?'LONG':'SHORT',pair:GM.label,lev:P.lev,stake:P.stake,pnl:pnl,mag:P.path.mag});if(GM.ops.length>30)GM.ops.pop();GM.pos=null;
   LG('egg','«Успіх»: '+(P.dir>0?'лонг':'шорт')+' ×'+P.lev+' рух '+(P.path.mag*100).toFixed(2)+'% +'+Math.round(pnl)+' $');}
 }else{var z=(Math.random()+Math.random()+Math.random()-1.5)*2;np=p*(1+z*.00042*(Math.random()<.05?3.5:1));}
 np=Math.max(p*.5,np);
 GM.sub++;if(GM.sub>=10){GM.sub=0;GM.c.push({o:np,h:np,l:np,c:np});if(GM.c.length>4000)GM.c.shift();}
 else{last.c=np;last.h=Math.max(last.h,np);last.l=Math.min(last.l,np);}
 gmDraw();gmUi();
}
function gmCandles(){var k=GM.tf,src=GM.c,out=[],st=src.length%k;for(var i=st;i<src.length;i+=k){var g=src.slice(i,i+k);if(!g.length)continue;
 out.push({o:g[0].o,c:g[g.length-1].c,h:Math.max.apply(null,g.map(function(q){return q.h;})),l:Math.min.apply(null,g.map(function(q){return q.l;}))});}return out.slice(-48);}
function gmDraw(){
 var cv=document.getElementById('gmCv');if(!cv)return;var w=cv.clientWidth||300,h=cv.clientHeight||220,dpr=Math.min(3,window.devicePixelRatio||1);
 if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
 var x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 var cs=gmCandles();if(cs.length<2)return;var lo=Infinity,hi=-Infinity;cs.forEach(function(q){lo=Math.min(lo,q.l);hi=Math.max(hi,q.h);});if(GM.pos){lo=Math.min(lo,GM.pos.entry);hi=Math.max(hi,GM.pos.entry);}
 var pad=(hi-lo)*.12||1;lo-=pad;hi+=pad;var R=56,cw=(w-R)/cs.length,Y=function(v){return 8+(h-16)*(1-(v-lo)/(hi-lo));};
 x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;for(var g=1;g<4;g++){x.beginPath();x.moveTo(0,h*g/4);x.lineTo(w-R,h*g/4);x.stroke();}
 var up=cs[cs.length-1].c>=cs[0].o,col=up?'#66d896':'#ff7d83';
 if(GM.mode==='candle'){cs.forEach(function(q,i){var cx=i*cw+cw/2,g2=q.c>=q.o;x.strokeStyle=x.fillStyle=g2?'#66d896':'#ff7d83';x.beginPath();x.moveTo(cx,Y(q.h));x.lineTo(cx,Y(q.l));x.stroke();
  var y0=Y(Math.max(q.o,q.c)),y1=Y(Math.min(q.o,q.c));x.fillRect(cx-cw*.32,y0,cw*.64,Math.max(1,y1-y0));});}
 else{x.beginPath();cs.forEach(function(q,i){var px=i*cw+cw/2,py=Y(q.c);i?x.lineTo(px,py):x.moveTo(px,py);});x.strokeStyle=col;x.lineWidth=2.2;x.lineJoin='round';x.stroke();
  x.lineTo((cs.length-.5)*cw,h);x.lineTo(cw/2,h);x.closePath();var gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,up?'rgba(102,216,150,.28)':'rgba(255,125,131,.28)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fill();}
 var lp=cs[cs.length-1].c,ly=Y(lp);x.setLineDash([4,4]);x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();x.moveTo(0,ly);x.lineTo(w-R,ly);x.stroke();
 if(GM.pos){var ey=Y(GM.pos.entry);x.strokeStyle='rgba(255,210,90,.7)';x.beginPath();x.moveTo(0,ey);x.lineTo(w-R,ey);x.stroke();}
 x.setLineDash([]);x.fillStyle=col;x.font='600 11px -apple-system,system-ui,sans-serif';x.fillText(gmFmt(lp,lp<10?4:2),w-R+4,ly+4);
 x.fillStyle='rgba(255,255,255,.4)';x.fillText(gmFmt(hi,hi<10?4:2),w-R+4,14);x.fillText(gmFmt(lo,lo<10?4:2),w-R+4,h-6);
}
function gmUi(){
 if(!GM)return;var $=function(id){return document.getElementById(id);};var lp=GM.c[GM.c.length-1].c;
 if($('gmBal'))$('gmBal').textContent=gmFmt(GM.bal)+' $';

/* ---------- Скупчення галактик (пасхалка після чорної діри) ----------
   Скляна кнопка із зірками з'являється вгорі праворуч, коли чорна діра все засмоктала. Тап — 3D-карта скупчення: 9 різних галактик
   (спіральна з 4 рукавами, з баром, еліптична, лінзоподібна, кільцева, пластівцева, 2-рукавна, неправильна, карликова), у кожної
   своя чорна діра (промінь крокує по викривленому простору: відхилення світла, тінь, фотонне кільце, диск, що крутиться, ефект Доплера),
   зорі обертаються навколо ядра, а ядра галактик притягуються (базовий N-тіл із м'яким потенціалом): зорі відчувають приливне притягання
   сусідів, а при зближенні галактики гальмують одна одну й зливаються (чорні діри теж). Кнопка швидкості прискорює час, і наприкінці все
   зливається в одну величезну галактику. Керування: орбіта (1 палець — обертання, 2 — масштаб і зсув, тап по галактиці — перелетіти до неї),
   «Далі ›» — до сусідньої, політ (палець — напрям, кількість пальців — швидкість). Вихід — приглушена скляна кнопка з логотипом в тому ж куті.
   Скляні кнопки малює шейдер скла (другий прохід основного полотна), значки зірок — DOM із світінням і блиманням. */

 yaw:.55,pit:.5,dist:60,tgt:[0,0,0],off:[0,0,0],cam:[0,0,0],spd:0,ptr:{},vy:0,vp:0,lastTap:0,sv:0,t0:0,last:0,btn:null,exit:null,pills:null,m1:null,m2:null,m3:null,m4:null,fadeRaf:0,

/* плавне з'явлення/зникнення скляних кнопок (шейдер береться з FBL[i].a) */
function gxFade(list,to,done){
 cancelAnimationFrame(GX.fadeRaf);
 var t0=performance.now(),from=list.map(function(f){return f.a;});
 (function step(){var k=Math.min(1,(performance.now()-t0)/380);list.forEach(function(f,i){f.a=from[i]+(to-from[i])*k;f.el.style.opacity=f.a;});dirty=true;
  if(k<1)GX.fadeRaf=requestAnimationFrame(step);else if(done)done();})();
}

function gxProg(g,vs,fs){
 function sh(t,s){var o=g.createShader(t);g.shaderSource(o,s);g.compileShader(o);if(!g.getShaderParameter(o,g.COMPILE_STATUS)){LG('galaxy','шейдер: '+g.getShaderInfoLog(o));return null;}return o;}
 var p=g.createProgram(),a=sh(g.VERTEX_SHADER,vs),b=sh(g.FRAGMENT_SHADER,fs);if(!a||!b)return null;
 g.attachShader(p,a);g.attachShader(p,b);g.bindAttribLocation(p,0,'a_p');g.bindAttribLocation(p,1,'a_c');g.bindAttribLocation(p,2,'a_s');g.linkProgram(p);
 if(!g.getProgramParameter(p,g.LINK_STATUS)){LG('galaxy','лінк: '+g.getProgramInfoLog(p));return null;}return p;
}

var GX_VS_STAR=[
'attribute vec3 a_p;attribute vec4 a_c;attribute vec3 a_s;',
'uniform vec3 u_cam,u_fwd,u_right,u_up;uniform float u_tan,u_asp,u_t,u_ps,u_hz,u_E,u_T;uniform vec2 u_hc;',
'uniform vec4 u_gp[9];uniform vec3 u_cen[9];uniform mat3 u_mat[9];',
'varying vec4 v_c;',
'void main(){',
' int gi=int(a_s.z+.5);vec4 gp=u_gp[gi];int ro=int(gp.x+.5);',
' float r=a_p.x;float ang=a_p.y+gp.y*(.9/pow(r+4.,.6))*u_T;',
' vec3 L=vec3(r*cos(ang),a_p.z,r*sin(ang));vec3 W=u_cen[ro]+u_mat[gi]*L;',
' vec3 dd=vec3(0.);for(int j=0;j<9;j++){if(j==ro)continue;vec4 gj=u_gp[j];if(gj.w<.5||int(gj.x+.5)!=j)continue;vec3 D=u_cen[j]-W;float d2=dot(D,D)+400.;dd+=D*inversesqrt(d2)*(gj.z*1.1*r*r/d2);}',   /* приливне притягання сусідніх галактик */
' float dl=length(dd);dd*=min(1.,r*.85/(dl+1e-3));W+=dd;',
' vec3 rel=W-u_cam;float z=dot(rel,u_fwd);',
' if(z<.3){gl_Position=vec4(3.,3.,0.,1.);gl_PointSize=0.;v_c=vec4(0.);return;}',
' vec2 n=vec2(dot(rel,u_right)/(z*u_tan*u_asp),dot(rel,u_up)/(z*u_tan));',
' if(z>u_hz){vec2 d=(n-u_hc)*vec2(u_asp,1.);float rr=length(d)+1e-4;float r2=.5*(rr+sqrt(rr*rr+4.*u_E*u_E));n=u_hc+d/rr*r2/vec2(u_asp,1.);}',   /* зорі за дірою: гравітаційна лінза (кільце Ейнштейна) */
' gl_Position=vec4(n,0.,1.);',
' float tw=.7+.3*sin(u_t*a_s.y+a_s.y*40.);',
' gl_PointSize=clamp(a_s.x*u_ps*(30./z+.7),1.,22.*u_ps);',

var GX_VS_HOLE='attribute vec3 a_p;uniform vec4 u_box;varying vec2 v_n;void main(){v_n=u_box.xy+a_p.xy*u_box.zw;gl_Position=vec4(v_n,0.,1.);}';
var GX_FS_HOLE=[
'precision highp float;',
'uniform vec3 u_cam,u_fwd,u_right,u_up;uniform float u_tan,u_asp,u_t,u_rs,u_rin,u_rout,u_rb;varying vec2 v_n;',
'float h21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}',
'vec3 ramp(float t){t=clamp(t,0.,1.);vec3 a=vec3(.35,.04,.02),b=vec3(1.,.42,.06),c=vec3(1.,.9,.72);return t<.5?mix(a,b,t*2.):mix(b,c,(t-.5)*2.);}',
'void main(){',
' vec3 rd=normalize(u_fwd+v_n.x*u_asp*u_tan*u_right+v_n.y*u_tan*u_up);vec3 ro=u_cam;',
' float b=dot(ro,rd),c=dot(ro,ro)-u_rb*u_rb,hh=b*b-c;',
' if(hh<0.){gl_FragColor=vec4(0.);return;}',
' hh=sqrt(hh);float t0=max(0.,-b-hh),t1=-b+hh;if(t1<=0.){gl_FragColor=vec4(0.);return;}',
' vec3 p=ro+rd*t0,v=rd;vec3 col=vec3(0.);float tr=1.,rmin=1e9;bool cap=false;',
' for(int i=0;i<64;i++){',
'  float r=length(p);rmin=min(rmin,r);',

'  vec3 pn=p+v*dt;v=normalize(v+acc*dt);',
'  if(p.y*pn.y<0.){float f=p.y/(p.y-pn.y);vec3 ip=mix(p,pn,f);float rr=length(ip.xz);',
'   if(rr>u_rin&&rr<u_rout){',
'    float phi=atan(ip.z,ip.x);float om=2.8/pow(rr,1.5);float ph2=phi-u_t*om;',   /* диференціальне обертання: внутрішня маса крутиться швидше */

'    col+=tr*ramp(temp*(.62+.5*dop))*em*1.7;',

'  p=pn;if(length(p)>u_rb*1.01&&dot(p,v)>0.)break;',

' col+=tr*vec3(1.,.82,.58)*ring*.95;',
' float alpha=cap?1.:clamp(1.-tr+ring*.55,0.,1.);if(cap)col=vec3(0.);',
' gl_FragColor=vec4(col,alpha);}'].join('\n');

function gxGalaxy(){
 var rnd=gxRng(20261005),G=[],total=0,i;GX_TYPES.forEach(function(q){total+=q.N;});

 function gs(){return(rnd()+rnd()+rnd()+rnd()-2)*.866;}
 function norm(v){var l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
 function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
 var GMs=0;GX_TYPES.forEach(function(q){GMs+=q.m;});

  G.push({name:q.n,type:q.t,R:Rg,m:q.m,sc:q.s,spin:q.spin,pos:pos,vel:vel,basis:[X[0],X[1],X[2],Y[0],Y[1],Y[2],Z[0],Z[1],Z[2]],root:i,alive:1});
  function put(r,th,y,c,br,sz){data[o++]=r;data[o++]=th;data[o++]=y;data[o++]=Math.min(1.4,c[0]*tn[0]);data[o++]=Math.min(1.4,c[1]*tn[1]);data[o++]=Math.min(1.4,c[2]*tn[2]);data[o++]=br;data[o++]=sz;data[o++]=1+rnd()*4;data[o++]=gi;}

  var cc=gxCenter(bi),vx=GX.cam[0]-cc[0],vy2=GX.cam[1]-cc[1],vz=GX.cam[2]-cc[2],cl=Math.hypot(vx,vy2,vz)||1;
