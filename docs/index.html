<title>Voice Finance</title>
<style>:root{--f:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Helvetica Neue',Arial,sans-serif;
 --tx:#f5f5f7;--mu:#9b9ba6;--mu2:#6d6d78;--ac:#ff7d83;--ac2:#ff454f;--gr:#66d896;--ln:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--f);color:var(--tx);-webkit-text-size-adjust:100%}
html{background-color:#050507;background-image:linear-gradient(to right,var(--glc,rgba(148,148,148,.17)) 1px,transparent 1px),linear-gradient(to bottom,var(--glc,rgba(148,148,148,.17)) 1px,transparent 1px);background-size:var(--gc,48.75px) var(--gc,48.75px);background-position:var(--gx,0) var(--gy,0)}body{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:-2;background:#050507}
.page{position:absolute;inset:0;overflow:hidden;touch-action:none;will-change:transform}
.inner{position:relative;padding:calc(env(safe-area-inset-top,0px) + 80px) 16px calc(150px + env(safe-area-inset-bottom,0px))}
.inner>div{margin:0 0 14px}
/* ---------- блоки ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px 2px}
.hdr h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.6px}
.hdr .sub{font-size:14px;color:var(--mu);margin-top:3px}
.hdr .back{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid var(--ln);font-size:22px;line-height:1;padding-bottom:3px}
.sec{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:8px 6px 0}
.tile{position:relative;border-radius:28px;padding:18px;border:1px solid rgba(255,255,255,.1);
 background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.03) 60%,rgba(255,255,255,.045))}
.tile.bal.up{background:linear-gradient(155deg,rgba(60,200,120,.12),rgba(60,200,120,.03) 62%,rgba(255,255,255,.02));border-color:rgba(60,210,130,.2)}
.tile.bal.dn{background:linear-gradient(155deg,rgba(255,125,131,.13),rgba(255,125,131,.03) 62%,rgba(255,255,255,.02));border-color:rgba(255,125,131,.22)}
.lbl{font-size:13px;color:var(--mu);font-weight:500}
.big{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px;margin-top:5px;white-space:nowrap}
.mid{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.chg{font-size:14px;font-weight:600;margin-top:6px;color:var(--gr)}.chg.neg{color:var(--ac)}.chg span{color:var(--mu);font-weight:500;margin-left:6px}
.spark{display:block;width:100%;height:84px;margin:14px 0 4px}
.split{display:flex;gap:10px;margin-top:12px}
.split>button{flex:1;display:flex;gap:10px;align-items:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln);min-width:0}
.split b{display:block;font-size:17px;font-weight:650;white-space:nowrap}
.dot{width:30px;height:30px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;font-weight:700}
.dot.up{background:rgba(102,216,150,.16);color:var(--gr)}.dot.dn{background:rgba(255,125,131,.16);color:var(--ac)}
.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.th h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.3px}
.th button{font-size:14px;color:var(--ac);font-weight:600;padding:4px 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--ln)}
.th+.row,.row.first{border-top:0}
.ic{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-style:normal}
.rc{flex:1;min-width:0}.rc b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{display:block;font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-size:16px;font-weight:650;white-space:nowrap}.row em.in{color:var(--gr)}
.row.paid{opacity:.5}
.empty{font-size:14px;line-height:1.45;color:var(--mu);padding:6px 0 4px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff9a9e,var(--ac2))}
.cap{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.4}
.srch{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--ln);color:var(--mu)}
.srch svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--tx);-webkit-appearance:none}
.srch input::placeholder{color:var(--mu2)}
.tools{display:flex;gap:10px}
.pillb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--ln);font-size:15px;font-weight:600;white-space:nowrap}
.pillb.ac{background:rgba(255,125,131,.16);border-color:rgba(255,125,131,.32);color:var(--ac)}
.pillb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:13px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln)}
.mini b{display:block;font-size:19px;margin-top:3px;font-weight:650;white-space:nowrap}
.cat{display:flex;align-items:center;gap:10px;margin-top:11px}.cat:first-of-type{margin-top:6px}
.cat .n{width:96px;font-size:14px;font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .b{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.cat .b i{display:block;height:100%;border-radius:4px;background:var(--c)}
.cat .a{width:78px;text-align:right;font-size:14px;font-weight:600;flex:none;white-space:nowrap}
.dd{display:inline-flex;align-items:center;gap:6px}
/* ---------- док ---------- */
#gl{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s}
#dock{will-change:transform;position:fixed;z-index:25;left:0;right:0;margin:0 auto;width:calc(100% - 28px);max-width:440px;height:72px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:none;-webkit-user-select:none;user-select:none}
#btns{display:flex;height:100%;padding:0 6px}
#btns button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10px var(--f);text-align:center;color:#fff;opacity:.7;transition:opacity .25s;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#btns button.on{opacity:1}
#btns svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#inp{position:fixed;left:0;top:0;z-index:31;margin:0;padding:0 56px 0 22px;width:0;height:0;border:0;outline:0;border-radius:26px;background:transparent;color:transparent;caret-color:transparent;font:400 17px var(--f);-webkit-appearance:none;appearance:none;pointer-events:none;-webkit-user-select:text;user-select:text;transition:color .15s}
#inp.show{color:#fff;caret-color:var(--ac)}
#inp::placeholder{color:transparent;transition:color .15s}
#inp.show::placeholder{color:rgba(255,255,255,.55)}
/* ---------- скляне меню (Додатково / списки) ---------- */
#menuShade{position:fixed;inset:0;z-index:27;display:none}
#menu{position:fixed;z-index:30;left:0;top:0;display:none;color:#fff;overflow:hidden;will-change:transform,opacity;border-radius:24px;touch-action:pan-y}
#menu.more{border-radius:62px;padding:24px 24px 22px;overflow-y:auto;overscroll-behavior:contain}
#menu .mh{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.62);padding:10px 6px 4px}
#menu .mh:first-child{padding-top:2px}
#menu .qa{display:flex;gap:8px;margin:6px 0 2px}
#menu .qa button{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;text-align:center}
#menu .mr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;border-radius:14px;font-size:15px;font-weight:550}
#menu .mr:active{background:rgba(255,255,255,.1)}
#menu .mr .ic{width:32px;height:32px;border-radius:16px;font-size:13px}
#menu .mr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mr .v{font-size:14px;color:rgba(255,255,255,.7);white-space:nowrap}
#menu.dd{padding:6px}
#menu.dd .mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:46px;padding:0 14px;border-radius:16px;font-size:16px;font-weight:550;white-space:nowrap}
#menu.dd .mi:active,#menu.dd .mi.cur{background:rgba(255,255,255,.12)}
#menu.dd .mi svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ---------- аркуші (форми) ---------- */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sh h3{margin:0;font-size:18px;font-weight:650;text-align:center;flex:1}
.sh button{font-size:16px;font-weight:600;padding:8px 10px;min-width:70px}
.sh .cn{color:var(--mu);text-align:left}.sh .ok{color:var(--ac);text-align:right}
.seg{display:flex;padding:3px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:15px;text-align:center;font-size:15px;font-weight:600;color:var(--mu)}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid var(--ln)}
.fr:last-of-type{border-bottom:0}
.fr>label,.fr>span.l{font-size:16px;color:var(--mu);flex:none}
.fr input[type=text],.fr input[type=search],.fr input[type=number],.fr input:not([type]){flex:1;min-width:0;text-align:right;background:none;border:0;outline:0;font-size:17px;padding:12px 0;-webkit-appearance:none;border-radius:0;color:#fff}
.fr input::placeholder{color:var(--mu2)}
.fr .dd{font-size:17px;font-weight:600;color:#fff;padding:12px 0;max-width:62%}
.fr .dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .dd svg{width:12px;height:12px;fill:none;stroke:var(--mu);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac2)}.sw.on::after{transform:translateX(20px)}
.err{color:var(--ac);font-size:14px;padding:8px 2px 0;min-height:0}

function monthStart(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function monthSpend(cat,d){d=d||new Date();var a=monthStart(d),b=new Date(d.getFullYear(),d.getMonth()+1,1),sum=0;
 fin.getState().transactions.forEach(function(t){if(t.type!=='expense'||t.currency!=='PLN')return;if(cat&&t.category!==cat)return;var x=new Date(t.date);if(x>=a&&x<b)sum+=t.amount;});return sum;}
function forecastMonth(){var d=new Date(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),spent=monthSpend(null,d),day=Math.max(1,d.getDate()+d.getHours()/24),proj=spent/day*days;return{spent:spent,proj:proj,days:days,left:days-d.getDate(),limit:fin.getState().goal};}
var MONTHS_UA=['січ','лют','бер','квіт','трав','черв','лип','серп','вер','жовт','лист','груд'];
function nlQuery(q){
 var x=String(q||'').toLowerCase().replace(/[’'?!.,]/g,' ');if(!/(скільки|сколько|how much|ile)/.test(x))return null;
 var now=new Date(),y=now.getFullYear(),m=now.getMonth(),label='цього місяця',found=false;
 if(/минул|прошл|last month/.test(x)){m--;if(m<0){m=11;y--;}label='минулого місяця';found=true;}
 MONTHS_UA.forEach(function(st,i){if(!found&&new RegExp('(^|\\s)'+st).test(x)&&!/^скільк/.test(st)){m=i;if(i>now.getMonth())y=now.getFullYear()-1;else y=now.getFullYear();label='у '+['січні','лютому','березні','квітні','травні','червні','липні','серпні','вересні','жовтні','листопаді','грудні'][i];found=true;}});
 var all=/за весь час|загалом|всього|усього/.test(x);if(all)label='за весь час';
 var inc=/зароб|дохід|доход|отрим/.test(x);
 var stop=/^(скільки|сколько|я|на|за|в|у|у|витратив|витратила|витрачено|потратив|грошей|було|цього|минулого|місяця|місяці|весь|час|зароб\S*|отрим\S*|дохід|доходу|how|much|ile|for|on|in|загалом|всього|усього)$/;
 var words=x.split(/\s+/).filter(function(w){return w&&!stop.test(w)&&!MONTHS_UA.some(function(st){return w.indexOf(st)===0;});});
 var stems=words.map(function(w){return VF.foldText(w).slice(0,Math.max(3,Math.min(5,w.length-1)));});
 var a=all?new Date(0):new Date(y,m,1),b=all?new Date(8.64e15):new Date(y,m+1,1),sum=0,list=[];
 fin.getState().transactions.forEach(function(t){if(t.type!==(inc?'income':'expense'))return;var dt=new Date(t.date);if(dt<a||dt>=b)return;
  var hay=VF.foldText([t.note,t.client,catName(t.category)].join(' '));if(stems.length&&!stems.every(function(st){return hay.indexOf(st)>=0;}))return;sum+=t.amount;list.push(t);});
 return{sum:sum,list:list,label:label,what:words.join(' '),inc:inc};
}

/* ---------- синхронізація між пристроями: шифрований код (AES-256-GCM, PBKDF2) ---------- */
var SYE=new TextEncoder(),SYD=new TextDecoder();
function syGetKey(){try{return localStorage.getItem('vf-synckey')||'';}catch(e){return'';}}
function sySetKey(k){try{localStorage.setItem('vf-synckey',k);}catch(e){}}
function b64u(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';var s=atob(t),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function syKeyFrom(pass,salt){return crypto.subtle.importKey('raw',SYE.encode(pass),'PBKDF2',false,['deriveKey']).then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
function syEncrypt(pass,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 return syKeyFrom(pass,salt).then(function(k){return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,SYE.encode(JSON.stringify(obj)));}).then(function(ct){return'VFSYNC1.'+b64u(salt)+'.'+b64u(iv)+'.'+b64u(new Uint8Array(ct));});}
function syDecrypt(pass,code){var p=String(code).trim().split('.');if(p[0]!=='VFSYNC1'||p.length!==4)return Promise.reject(new Error('Це не код синхронізації'));
 return syKeyFrom(pass,unb64u(p[1])).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u(p[2])},k,unb64u(p[3]));}).then(function(pt){return JSON.parse(SYD.decode(pt));},function(){throw new Error('Невірний ключ або код пошкоджено');});}
function syField(n){var e=curSheet&&curSheet.body.querySelector('[data-sy="'+n+'"]');return e?e.value:'';}
function syNeedKey(){var k=syField('key').trim().toUpperCase();if(k.length<8){toast('Спершу введіть або створіть ключ (мінімум 8 символів)');return'';}sySetKey(k);return k;}
function syGen(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16)),k='';for(var i=0;i<16;i++){k+=A[r[i]%32];if(i%4===3&&i<15)k+='-';}
 var e=curSheet.body.querySelector('[data-sy="key"]');if(e)e.value=k;sySetKey(k);sheetStale();toast('Ключ створено. Збережіть його: на інших пристроях введіть такий самий');}
function syExport(){var k=syNeedKey();if(!k)return;var st=fin.getState();
 syEncrypt(k,{app:'voice-finance-glass',v:1,at:new Date().toISOString(),data:{transactions:st.transactions,debts:st.debts,accounts:st.accounts,categories:st.categories,balanceSnapshots:st.balanceSnapshots}}).then(function(code){
  LG('sync','експорт, символів '+code.length);
  if(navigator.share){navigator.share({text:code,title:'Voice Finance — код синхронізації'}).catch(function(){});}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(function(){toast('Код скопійовано');},function(){toast('Не вдалося скопіювати');});}
 }).catch(function(e){toast('Помилка шифрування: '+(e.message||e));});}
function syImport(mode){var k=syNeedKey();if(!k)return;var code=syField('code');if(!code.trim()){toast('Вставте код з іншого пристрою');return;}
 syDecrypt(k,code).then(function(o){if(!o||o.app!=='voice-finance-glass'||!o.data)throw new Error('Невідомий формат коду');
  var r=fin.importSnapshot(o.data,{mode:mode});LG('sync','імпорт '+mode+' '+JSON.stringify(r));
  toast(mode==='merge'?'Додано: операцій '+r.transactions+', боргів '+r.debts+', рахунків '+r.accounts:'Дані замінено: операцій '+r.transactions);
 }).catch(function(e){toast(e.message||String(e));});}

/* ---------- м’яке натискання на будь-який віджет чи кнопку: пружина масштабу + легка віддача сусідів ---------- */
var PRS=new Map(),PRraf=0,PRlast=0,PRd=null;
function prKick(){if(!PRraf){PRlast=performance.now();PRraf=requestAnimationFrame(prStep);}}
function prSt(el){var s=el._ps;if(!s){s=el._ps={s:1,v:0,ts:1,dx:0,dy:0,vx:0,vy:0,tdx:0,tdy:0};PRS.set(el,s);}return s;}
function prStep(t){
 PRraf=0;var dt=Math.min(.033,Math.max(.001,(t-PRlast)/1000)),sg=0;PRlast=t;
 PRS.forEach(function(s,el){
  for(var q=0;q<2;q++){var h=dt/2;s.v+=(430*(s.ts-s.s)-23*s.v)*h;s.s+=s.v*h;s.vx+=(430*(s.tdx-s.dx)-26*s.vx)*h;s.dx+=s.vx*h;s.vy+=(430*(s.tdy-s.dy)-26*s.vy)*h;s.dy+=s.vy*h;}
  if(Math.abs(s.s-1)<.0008&&Math.abs(s.v)<.012&&Math.abs(s.dx)<.03&&Math.abs(s.dy)<.03&&s.ts===1&&!s.tdx&&!s.tdy){el.style.scale='';el.style.translate='';el._ps=null;PRS.delete(el);}
  else{el.style.scale=s.s.toFixed(4);el.style.translate=s.dx.toFixed(2)+'px '+s.dy.toFixed(2)+'px';sg+=s.s+s.dx*.013+s.dy*.017;}
 });
 PRSIG=sg.toFixed(4);dirty=true;
 if(PRS.size)prKick();
}
function prNudge(el,mag){
 var p=el.parentElement;if(!p)return;var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,lim=Math.max(r.width,r.height)*1.9+60;
 [].forEach.call(p.children,function(c){if(c===el||c.nodeType!==1||!c.offsetWidth)return;var q=c.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy,d=Math.hypot(dx,dy);if(d<1||d>lim)return;
  var k=mag*(1-d/lim),s=prSt(c);if(Math.abs(dx)>Math.abs(dy)*1.4){s.tdx=dx/d*k*1.6;s.tdy=0;}else if(Math.abs(dy)>Math.abs(dx)*1.4){s.tdy=dy/d*k*1.6;s.tdx=0;}else{s.tdx=dx/d*k;s.tdy=dy/d*k;}
  PRd.nb.push(c);});
}
function prDown(e){
 if(e.button>0||!e.target.closest)return;
 var t=e.target;if(t.closest('input,textarea,select,#dock,#send,#inp,#ticker,.sw,[data-cg]'))return;
 var el=t.closest('button,[data-act],.pillb,.mr,.btnw'),tile=t.closest('.tile');
 if(el&&tile&&el.tagName==='DIV'&&el.parentElement&&el.parentElement.classList.contains('tile'))el=tile;   /* віджет-ціле (напр. баланс) */
 else if(!el&&tile&&tile.querySelector('[data-act]')&&0)el=tile;
 if(!el)return;
 prUp(true);
 var r=el.getBoundingClientRect(),small=Math.min(r.width,r.height)<64&&r.width<120,big=r.width>220&&r.height>110,s=el.classList.contains('tile')?.985:big?.985:r.width>200?.972:small?.9:.94;
 PRd={el:el,tile:null,x:e.clientX,y:e.clientY,t:performance.now(),nb:[]};
 var st=prSt(el);st.ts=s;
 if(el!==tile&&tile&&!el.classList.contains('mr')){var ts=prSt(tile);ts.ts=.993;PRd.tile=tile;}
 prNudge(el,small?3:el.classList.contains('tile')?2.4:1.8);
 prKick();
}
function prUp(now){
 var d=PRd;if(!d)return;PRd=null;
 var rel=function(){[d.el,d.tile].concat(d.nb).forEach(function(c){var s=c&&c._ps;if(s){s.ts=1;s.tdx=0;s.tdy=0;}});prKick();};
 var w=now?0:Math.max(0,90-(performance.now()-d.t));
 if(w>0)setTimeout(rel,w);else rel();

document.addEventListener('pointerdown',prDown,true);
['pointerup','pointercancel'].forEach(function(n){document.addEventListener(n,function(){prUp(false);},true);});

/* ---------- автосинхронізація: знімок усіх даних шифрується ключем і лежить у приватному gist; останній запис перемагає ---------- */
var SYN=(function(){var d={on:0,id:'',tok:'',dev:'',at:0,init:0};try{var j=JSON.parse(localStorage.getItem('vf-gist')||'null');if(j)d=Object.assign(d,j);}catch(e){}if(!d.dev)d.dev=Math.random().toString(36).slice(2,10);return d;})();
var synBusy=0,synPT=0,synApplying=0,synSt='',synTick=0;

function synStat(m){synSt=m;var e=curSheet&&curSheet.body.querySelector('[data-sy-st]');if(e)e.textContent=m;}
function synApi(method,path,body){return fetch('https://api.github.com'+path,{method:method,headers:{'Authorization':'Bearer '+SYN.tok,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined}).then(function(r){if(!r.ok)throw new Error('GitHub '+r.status);return r.json();});}

function synPush(){
 if(!SYN.on||synBusy)return;var key=syGetKey();if(!key||!SYN.tok)return;synBusy=1;var pl=synPayload();
 return syEncrypt(key,pl).then(function(code){var body={files:{'vf-sync.txt':{content:code}}};
  if(!SYN.id){body.public=false;body.description='Voice Finance sync';return synApi('POST','/gists',body).then(function(g){SYN.id=g.id;});}
  return synApi('PATCH','/gists/'+SYN.id,body);
 }).then(function(){SYN.at=pl.at;synSave();synBusy=0;synStat('Синхронізовано '+new Date().toLocaleTimeString('uk-UA'));}).catch(function(e){synBusy=0;synStat('Помилка надсилання: '+(e.message||e));});
}
function synPull(first){
 if(!SYN.on||!SYN.id||synBusy||synPT)return Promise.resolve();var key=syGetKey();if(!key||!SYN.tok)return Promise.resolve();synBusy=1;
 return synApi('GET','/gists/'+SYN.id).then(function(g){var f=g.files&&g.files['vf-sync.txt'];if(!f||!f.content)return null;return syDecrypt(key,f.content);}).then(function(o){
  synBusy=0;if(!o||!o.data)return;
  if(first){synApplying=1;try{fin.importSnapshot(o.data,{mode:'merge'});}finally{synApplying=0;}SYN.at=o.at;synSave();return;}
  if(o.dev!==SYN.dev&&o.at>SYN.at){synApplying=1;try{fin.importSnapshot(o.data,{mode:'replace'});}finally{synApplying=0;}SYN.at=o.at;synSave();synStat('Оновлено з іншого пристрою '+new Date().toLocaleTimeString('uk-UA'));}
 }).catch(function(e){synBusy=0;synStat('Помилка отримання: '+(e.message||e));});
}
function synToggle(){
 if(SYN.on){SYN.on=0;synSave();synStat('Вимкнено');return;}
 var key=syGetKey();if(!key){toast('Спершу створіть ключ синхронізації вище');return;}
 SYN.tok=syField('tok').trim();SYN.id=syField('gid').trim();if(!SYN.tok){toast('Введіть GitHub-токен');return;}
 SYN.on=1;SYN.at=0;synSave();synStat('Підключення…');

 if(SYN.id)synPull(true).then(go);else go();
}

/* ---------- світіння за пальцем: суцільний насичений лазерний слід кольору балансу; малюється в текстуру, яку скло плиток заломлює ---------- */
var FGc=null,FGp=[],FGraf=0,FGdown=false;
function fgPal(t){var f=((t%1)+1)%1*4,A=[[255,66,133],[148,77,255],[46,140,255],[255,153,66]],i=Math.floor(f),u=f-i;u=u*u*(3-2*u);var a=A[i%4],b=A[(i+1)%4];return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u];}

/* яскравість сліду від швидкості пальця (v у пікселях за мс): повільно ~0.3, швидко до 1.25 */
function fgSpd(v){return .3+.95*Math.pow(Math.min(1,(v||0)/1.6),.75);}
function kickFg(){if(!FGraf)FGraf=requestAnimationFrame(fgStep);}
function fgStep(){
 FGraf=0;var now=performance.now(),LIFE=500+FGS.l*20,IN=FGS.i/100,BR=30+FGS.w*.75;

 /* шлях → рівномірні вершини (не більше 24), шейдер з'єднує їх у суцільну лінію */
 var pts=[],i,len=0;for(i=1;i<FGp.length;i++)if(!FGp[i].b)len+=Math.hypot(FGp[i].x-FGp[i-1].x,FGp[i].y-FGp[i-1].y);

  if(i>0&&!b.b){var a=FGp[i-1],ageA=1-(now-a.t)/LIFE,d=Math.hypot(b.x-a.x,b.y-a.y),u=0;

  else{pts.push([b.x,b.y,ageB,b.v,b.t,1]);acc=step;}}   /* 1 — початок штриха */

 for(var sm=0;sm<2;sm++){var sp=pts.map(function(q){return q.slice();});for(i=1;i<pts.length-1;i++){if(pts[i][5]||pts[i+1][5])continue;sp[i][0]=(pts[i-1][0]+2*pts[i][0]+pts[i+1][0])/4;sp[i][1]=(pts[i-1][1]+2*pts[i][1]+pts[i+1][1])/4;}pts=sp;}
 var n=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(i=0;i<pts.length;i++){var q=pts[i],al=Math.pow(Math.max(0,q[2]),1.4),r=BR*(1-Math.min(1,q[3]/3)*.3)*(.55+.45*q[2]);if(al<.01||r<1){if(i+1<pts.length)pts[i+1][5]=1;continue;}

/* попередження бюджету після нової операції: 80% і 100% */
fin.subscribe(function(ev){if(ev.type!=='transaction:save')return;var tx2=ev.state.transactions.find(function(q){return q.id===ev.detail.id;});if(!tx2||tx2.type!=='expense')return;
 var c=ev.state.categories.find(function(q){return q.id===tx2.category;});if(!c||!c.budget)return;var sp=monthSpend(c.id),p=sp/c.budget*100;
 if(p>=100)toast('Бюджет «'+c.name+'» перевищено: '+money(sp)+' з '+money(c.budget));else if(p>=80)toast('Бюджет «'+c.name+'»: використано '+Math.round(p)+'%');});
/* експорт у CSV (Excel, Numbers, Google Таблиці) */
function exportCsv(){
 var st=fin.getState(),q=function(v){v=String(v==null?'':v);return/[";,\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 var rows=[['Дата','Тип','Сума','Валюта','Категорія','Клієнт','Нотатка','Рахунок']];
 st.transactions.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);}).forEach(function(t){var acc=st.accounts.find(function(a){return a.id===t.accountId;});
  rows.push([new Date(t.date).toISOString().slice(0,16).replace('T',' '),t.type==='income'?'Дохід':'Витрата',String(t.amount).replace('.',','),t.currency,catName(t.category),t.client,t.note,acc?(acc.displayName||acc.bankName):'']);});
 var csv='\ufeff'+rows.map(function(r){return r.map(q).join(';');}).join('\r\n'),name='voice-finance-'+new Date().toISOString().slice(0,10)+'.csv';
 var f=null;try{f=new File([csv],name,{type:'text/csv'});}catch(e){}
 if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Операції'}).catch(function(){});return;}
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ---------- пасхалка «чорна діра»: утримання на краплі внизу сторінки ----------
   Діра з'являється в центрі, всмоктує по спіралі блоки сторінки (DOM + їхнє скло через _ps), док, бігучий рядок і полотно скла;
   ободок світла гасне й затягується лінзою; лишається діра на сітці, потім стискається — лишається фон і дисторсія по краях.
   Повторний тап — усе вилітає назад на свої місця. Дані не змінюються. */
var BHI=[],BHraf=0,BHt0=0,BHR0=34;
function bhEase(x){return x<=0?0:x>=1?1:x*x*(3-2*x);}
function bhBack(x){x=Math.max(0,Math.min(1,x));var c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);}
function bhCollect(){
 BHI=[];var hx=BH.x,hy=BH.y,mx=1;
 var add=function(el,css){if(!el)return;var r=el.getBoundingClientRect();if(r.width<1||r.bottom<0||r.top>VH)return;var bx=r.left+r.width/2,by=r.top+r.height/2,d=Math.hypot(bx-hx,by-hy);mx=Math.max(mx,d);
  var st0=el.style;BHI.push({el:el,css:css,bx:bx,by:by,d:d,a0:Math.atan2(by-hy,bx-hx),o0:{opacity:st0.opacity,visibility:st0.visibility,transformOrigin:st0.transformOrigin}});if(css){el.style.transformOrigin=(hx-r.left).toFixed(1)+'px '+(hy-r.top).toFixed(1)+'px';}};
 [].forEach.call(inn[sel].children,function(el){add(el,0);});
 add(tickerEl,1);add(document.getElementById('dock'),1);add(cv,1);
 /* док і його скло на полотні мають рухатись разом: однакова затримка */
 var dk=BHI.find(function(i){return i.el.id==='dock';});
 BHI.forEach(function(i){i.dl=.3+1.1*(i.d/mx);if(i.el===cv&&dk)i.dl=dk.dl;});
}
function bhApply(i,e){   /* e: 0 — на місці, 1 — у діру */
 var s=Math.max(.001,Math.pow(1-e,1.25)),op=1-bhEase((e-.72)/.28);
 if(i.css){i.el.style.scale=s.toFixed(4);i.el.style.rotate=(e*e*160).toFixed(2)+'deg';i.el.style.opacity=op.toFixed(3);return;}
 var th=2.6*Math.pow(e,1.5),rr=(1-e),dx=BH.x+Math.cos(i.a0+th)*i.d*rr-i.bx,dy=BH.y+Math.sin(i.a0+th)*i.d*rr-i.by;
 i.el._ps={s:s,dx:dx,dy:dy};i.el.style.scale=s.toFixed(4);i.el.style.translate=dx.toFixed(2)+'px '+dy.toFixed(2)+'px';i.el.style.opacity=op.toFixed(3);
}
function bhClear(){BHI.forEach(function(i){var st=i.el.style;st.scale='';st.translate='';st.rotate='';st.opacity=i.o0.opacity;st.visibility=i.o0.visibility;st.transformOrigin=i.o0.transformOrigin;if(!i.css)i.el._ps=null;});BHI=[];}   /* повертаємо власні стилі рушія (напр. opacity полотна) */
function bhStep(t){
 BHraf=0;var u=(t-BHt0)/1000,sig=0;
 if(BH.ph===1){                      /* всмоктування */
  var gr=bhEase(u/.6);BH.r=BHR0*gr;BH.k=gr;
  BHI.forEach(function(i){var e=Math.pow(Math.max(0,Math.min(1,(u-i.dl)/1.1)),1.8);bhApply(i,e);sig+=e;});
  BH.au=1-bhEase((u-1.6)/.9);
  if(u>3.1){var sh=bhEase((u-3.1)/.6);BH.r=BHR0*(1-sh);BH.k=1-sh;}
  if(u>=3.75){BH.ph=3;BH.r=0;BH.k=0;BH.au=0;BHI.forEach(function(i){i.el.style.visibility='hidden';});LG('egg','чорна діра: усе всмоктано');}
 }else if(BH.ph===2){               /* вилітання назад */
  var g2=bhEase(u/.35);BH.r=BHR0*g2;BH.k=g2;
  BHI.forEach(function(i){var p=(u-.3-i.dl*.45)/1.0;if(p>0)i.el.style.visibility=i.o0.visibility;bhApply(i,p<=0?1:1-bhBack(p));sig+=p;});
  BH.au=bhEase((u-.8)/.8);
  if(u>1.5){var s2=bhEase((u-1.5)/.5);BH.r=BHR0*(1-s2);BH.k=1-s2;}
  if(u>=2.4){BH.ph=0;BH.r=0;BH.k=0;BH.au=1;bhClear();tlAll();LG('egg','чорна діра: усе повернулось');}
 }
 PRSIG='bh'+sig.toFixed(3)+BH.r.toFixed(2);dirty=true;
 if(BH.ph===1||BH.ph===2)BHraf=requestAnimationFrame(bhStep);
}
function bhStart(){
 if(BH.ph)return;BH.x=VW/2;BH.y=VH*.46;BH.r=0;BH.k=0;BH.au=1;
 try{if(LN.on)lensToggle(0,0);}catch(e){}
 bhCollect();BH.ph=1;BHt0=performance.now();LG('egg','чорна діра: всмоктування ('+BHI.length+' елементів)');BHraf=requestAnimationFrame(bhStep);
}
function bhBackOut(){BH.ph=2;BHt0=performance.now();LG('egg','чорна діра: вилітання');BHraf=requestAnimationFrame(bhStep);}
/* поки діра працює, інтерфейс не реагує; коли все всмоктано — будь-який тап повертає */
['pointerdown','click','touchstart'].forEach(function(n){window.addEventListener(n,function(e){if(!BH.ph)return;e.stopPropagation();if(e.cancelable)e.preventDefault();if(n==='pointerdown'&&BH.ph===3)bhBackOut();},{capture:true,passive:false});});
/* активація: 13 тапів підряд по скляній лінзі (пауза між тапами до 0.8 с); лічильник — у lensTap (engine.js) */
var BHtap={n:0,t:0};
function lensTap(){var now=performance.now();BHtap.n=now-BHtap.t<800?BHtap.n+1:1;BHtap.t=now;
 if(BHtap.n>=13){BHtap.n=0;LG('egg','13 тапів по лінзі');bhStart();return true;}return false;}
