<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050507">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Voice Finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<title>Voice Finance</title>
<style>:root{--f:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,'Helvetica Neue',Arial,sans-serif;
 --tx:#f5f5f7;--mu:#9b9ba6;--mu2:#6d6d78;--ac:#ff7d83;--ac2:#ff454f;--gr:#66d896;--ln:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:var(--f);color:var(--tx);-webkit-text-size-adjust:100%}
html{background:#050507}body{background:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit}
#bg{position:fixed;inset:0;z-index:-1;background:
 radial-gradient(60% 38% at 90% 4%,#4d1722 0,transparent 70%),
 radial-gradient(70% 42% at 4% 46%,#161a44 0,transparent 70%),
 radial-gradient(60% 38% at 94% 92%,#0f3036 0,transparent 70%),#050507}
.page{position:absolute;inset:0;overflow:hidden;touch-action:none;will-change:transform}
.inner{position:relative;padding:calc(env(safe-area-inset-top,0px) + 22px) 16px calc(150px + env(safe-area-inset-bottom,0px))}
.inner>div{margin:0 0 14px}
/* ---------- блоки ---------- */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 4px 2px}
.hdr h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.6px}
.hdr .sub{font-size:14px;color:var(--mu);margin-top:3px}
.hdr .back{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.08);border:1px solid var(--ln);font-size:22px;line-height:1;padding-bottom:3px}
.sec{font-size:13px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:8px 6px 0}
.tile{position:relative;border-radius:28px;padding:18px;border:1px solid rgba(255,255,255,.1);
 background:linear-gradient(155deg,rgba(255,255,255,.085),rgba(255,255,255,.03) 60%,rgba(255,255,255,.045))}
.tile.hot{background:linear-gradient(155deg,rgba(255,125,131,.2),rgba(255,125,131,.05) 62%,rgba(255,255,255,.04));border-color:rgba(255,125,131,.28)}
.lbl{font-size:13px;color:var(--mu);font-weight:500}
.big{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-1px;margin-top:5px;white-space:nowrap}
.mid{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.5px;margin-top:4px;white-space:nowrap}
.chg{font-size:14px;font-weight:600;margin-top:6px;color:var(--gr)}.chg.neg{color:var(--ac)}.chg span{color:var(--mu);font-weight:500;margin-left:6px}
.spark{display:block;width:100%;height:84px;margin:14px 0 4px}
.split{display:flex;gap:10px;margin-top:12px}
.split>button{flex:1;display:flex;gap:10px;align-items:center;padding:12px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln);min-width:0}
.split b{display:block;font-size:17px;font-weight:650;white-space:nowrap}
.dot{width:30px;height:30px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;font-weight:700}
.dot.up{background:rgba(102,216,150,.16);color:var(--gr)}.dot.dn{background:rgba(255,125,131,.16);color:var(--ac)}
.th{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.th h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.3px}
.th button{font-size:14px;color:var(--ac);font-weight:600;padding:4px 2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-top:1px solid var(--ln)}
.th+.row,.row.first{border-top:0}
.ic{width:40px;height:40px;border-radius:20px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;font-style:normal}
.rc{flex:1;min-width:0}.rc b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc span{display:block;font-size:13px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row em{font-style:normal;font-size:16px;font-weight:650;white-space:nowrap}.row em.in{color:var(--gr)}
.row.paid{opacity:.5}
.empty{font-size:14px;line-height:1.45;color:var(--mu);padding:6px 0 4px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ff9a9e,var(--ac2))}
.cap{font-size:13px;color:var(--mu);margin-top:10px;line-height:1.4}
.srch{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.06);border:1px solid var(--ln);color:var(--mu)}
.srch svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.srch input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--tx);-webkit-appearance:none}
.srch input::placeholder{color:var(--mu2)}
.tools{display:flex;gap:10px}
.pillb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid var(--ln);font-size:15px;font-weight:600;white-space:nowrap}
.pillb.ac{background:rgba(255,125,131,.16);border-color:rgba(255,125,131,.32);color:var(--ac)}
.pillb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{padding:13px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid var(--ln)}
.mini b{display:block;font-size:19px;margin-top:3px;font-weight:650;white-space:nowrap}
.cat{display:flex;align-items:center;gap:10px;margin-top:11px}.cat:first-of-type{margin-top:6px}
.cat .n{width:96px;font-size:14px;font-weight:600;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .b{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.cat .b i{display:block;height:100%;border-radius:4px;background:var(--c)}
.cat .a{width:78px;text-align:right;font-size:14px;font-weight:600;flex:none;white-space:nowrap}
.dd{display:inline-flex;align-items:center;gap:6px}
/* ---------- док ---------- */
#gl{position:fixed;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s}
#dock{will-change:transform;position:fixed;z-index:25;left:0;right:0;margin:0 auto;width:calc(100% - 28px);max-width:440px;height:72px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);touch-action:none;-webkit-user-select:none;user-select:none}
#btns{display:flex;height:100%;padding:0 6px}
#btns button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 10px var(--f);text-align:center;color:#fff;opacity:.7;transition:opacity .25s;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
#btns button.on{opacity:1}
#btns svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#inp{position:fixed;left:0;top:0;z-index:31;margin:0;padding:0 56px 0 22px;width:0;height:0;border:0;outline:0;border-radius:26px;background:transparent;color:transparent;caret-color:transparent;font:400 17px var(--f);-webkit-appearance:none;appearance:none;pointer-events:none;-webkit-user-select:text;user-select:text;transition:color .15s}
#inp.show{color:#fff;caret-color:var(--ac)}
#inp::placeholder{color:transparent;transition:color .15s}
#inp.show::placeholder{color:rgba(255,255,255,.55)}
/* ---------- скляне меню (Додатково / списки) ---------- */
#menuShade{position:fixed;inset:0;z-index:27;display:none}
#menu{position:fixed;z-index:30;left:0;top:0;display:none;color:#fff;overflow:hidden;will-change:transform,opacity;border-radius:24px;touch-action:pan-y}
#menu.more{border-radius:62px;padding:24px 24px 22px;overflow-y:auto;overscroll-behavior:contain}
#menu .mh{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.62);padding:10px 6px 4px}
#menu .mh:first-child{padding-top:2px}
#menu .qa{display:flex;gap:8px;margin:6px 0 2px}
#menu .qa button{flex:1;height:44px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:600;text-align:center}
#menu .mr{display:flex;align-items:center;gap:10px;width:100%;padding:9px 6px;border-radius:14px;font-size:15px;font-weight:550}
#menu .mr:active{background:rgba(255,255,255,.1)}
#menu .mr .ic{width:32px;height:32px;border-radius:16px;font-size:13px}
#menu .mr .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu .mr .v{font-size:14px;color:rgba(255,255,255,.7);white-space:nowrap}
#menu.dd{padding:6px}
#menu.dd .mi{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:46px;padding:0 14px;border-radius:16px;font-size:16px;font-weight:550;white-space:nowrap}
#menu.dd .mi:active,#menu.dd .mi.cur{background:rgba(255,255,255,.12)}
#menu.dd .mi svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ---------- аркуші (форми) ---------- */
#scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sh h3{margin:0;font-size:18px;font-weight:650;text-align:center;flex:1}
.sh button{font-size:16px;font-weight:600;padding:8px 10px;min-width:70px}
.sh .cn{color:var(--mu);text-align:left}.sh .ok{color:var(--ac);text-align:right}
.seg{display:flex;padding:3px;border-radius:18px;background:rgba(255,255,255,.07);margin-bottom:6px}
.seg button{flex:1;height:36px;border-radius:15px;text-align:center;font-size:15px;font-weight:600;color:var(--mu)}
.seg button.on{background:rgba(255,255,255,.14);color:#fff}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-bottom:1px solid var(--ln)}
.fr:last-of-type{border-bottom:0}
.fr>label,.fr>span.l{font-size:16px;color:var(--mu);flex:none}
.fr input[type=text],.fr input[type=search],.fr input[type=number],.fr input:not([type]){flex:1;min-width:0;text-align:right;background:none;border:0;outline:0;font-size:17px;padding:12px 0;-webkit-appearance:none;border-radius:0;color:#fff}
.fr input::placeholder{color:var(--mu2)}
.fr .dd{font-size:17px;font-weight:600;color:#fff;padding:12px 0;max-width:62%}
.fr .dd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .dd svg{width:12px;height:12px;fill:none;stroke:var(--mu);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sw{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac2)}.sw.on::after{transform:translateX(20px)}
.err{color:var(--ac);font-size:14px;padding:8px 2px 0;min-height:0}
.btnw{display:block;width:100%;height:50px;border-radius:25px;margin-top:12px;text-align:center;font-size:16px;font-weight:650;background:rgba(255,255,255,.09);border:1px solid var(--ln)}
.btnw.pri{background:linear-gradient(135deg,#ff8d92,var(--ac2));border:0;color:#fff}.btnw.dng{color:var(--ac)}
.pv{padding:4px 0 2px}.pv .big{font-size:36px;margin:0}.pv .kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--ln);font-size:16px}
.pv .kv span{color:var(--mu)}.pv .kv b{font-weight:600;text-align:right;min-width:0}
.pv .note{font-size:13px;color:var(--mu);line-height:1.4;margin-top:10px}
.toast{position:fixed;z-index:40;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);padding:12px 18px;border-radius:22px;background:rgba(30,30,36,.96);border:1px solid var(--ln);font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

#pages{position:fixed;inset:0}
#sheets{position:fixed;inset:0;pointer-events:none}
/* ---------- кнопка відправлення ---------- */
#send{position:fixed;left:0;top:0;z-index:32;width:38px;height:38px;border-radius:19px;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ff8d93,#ff454f);box-shadow:0 2px 10px rgba(255,69,79,.4),inset 0 1px 0 rgba(255,255,255,.35);opacity:0;pointer-events:none;transition:opacity .2s,filter .2s;transform:translate3d(-100px,-100px,0)}
#send svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#send.show{opacity:1;pointer-events:auto}
#send.show.empty{opacity:.5;filter:saturate(.35)}
#send:active{filter:brightness(.9)}
/* ---------- екран завантаження ---------- */
#boot{position:fixed;inset:0;z-index:15;background:#050507;--bx:50%;--by:50%;--br:0px;
 -webkit-mask-image:radial-gradient(circle at var(--bx) var(--by),transparent var(--br),#000 calc(var(--br) + .5px));mask-image:radial-gradient(circle at var(--bx) var(--by),transparent var(--br),#000 calc(var(--br) + .5px))}
#boot .bwrap{position:absolute;left:50%;top:46%;width:0;height:0}
#boot .bglow{position:absolute;left:-170px;top:-170px;width:340px;height:340px;border-radius:50%;opacity:0;
 background:radial-gradient(closest-side,rgba(255,64,76,.7),rgba(255,50,64,.26) 48%,rgba(255,40,60,0) 76%);filter:blur(8px);
 animation:bGlowIn 1.5s ease-out .1s forwards;transition:transform .3s cubic-bezier(.3,0,.2,1),opacity .3s,filter .3s}
#boot .blogo{position:absolute;left:-58px;top:-58px;width:116px;height:116px;border-radius:26px;overflow:hidden;opacity:0;transform:scale(.86);
 animation:bIn 1.3s cubic-bezier(.2,.75,.25,1) .1s forwards;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 36px rgba(255,70,80,.4);
 transition:transform .3s cubic-bezier(.3,0,.2,1),box-shadow .3s,opacity .3s}
#boot .blogo img{display:block;width:100%;height:100%}
#boot .bbar{position:absolute;left:-70px;top:132px;width:140px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:bBarIn .8s ease-out .6s forwards;transition:opacity .25s}
#boot .bbar i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(90deg,#66d896,#ff7d83);transform-origin:0 50%;transform:scaleX(0);transition:transform .22s linear}
#boot .bwrap.p1 .bglow{animation:none;opacity:.85;transform:scale(.62);filter:blur(8px) brightness(1.6)}
#boot .bwrap.p1 .blogo{animation:none;opacity:1;transform:scale(.76);box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 70px rgba(255,60,70,.95),0 0 18px rgba(255,90,100,.8)}
#boot .bwrap.p2 .bglow{animation:none;opacity:0;transform:scale(2.7);filter:blur(14px);transition:transform 1s cubic-bezier(.2,.7,.3,1),opacity .9s ease-out .1s,filter 1s}
#boot .bwrap.p2 .blogo{animation:none;transform:scale(1.2);opacity:0;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 90px rgba(255,70,80,.8);transition:transform .7s cubic-bezier(.2,.8,.3,1),opacity .55s .08s,box-shadow .6s}
#boot .bwrap.p1 .bbar,#boot .bwrap.p2 .bbar{opacity:0}
@keyframes bIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
@keyframes bGlowIn{from{opacity:0;transform:scale(.8)}to{opacity:.85;transform:scale(1)}}
@keyframes bBarIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){#boot .blogo,#boot .bglow,#boot .bbar{animation-duration:.01s}}
/* ---------- скляні вікна (налаштування, форми, підтвердження) ---------- */
#sheets{z-index:29}
.sheet{position:fixed;left:0;top:0;display:none;color:#fff;border-radius:62px;overflow:hidden;will-change:transform,opacity;pointer-events:auto;touch-action:pan-y}
.sheet .sbody{height:100%;margin:0;max-width:none;border:0;border-radius:0;background:none;max-height:none;padding:26px 28px 28px;overflow-y:auto;overscroll-behavior:contain}
.sheet.ghost .sbody{visibility:hidden}

/* ---------- розмиття й тінь по краю екрана під вікнами ---------- */
#edge{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;
 -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 90px 14px rgba(0,0,0,.28);
 -webkit-mask-image:linear-gradient(to right,#000,transparent 12%,transparent 88%,#000),linear-gradient(to bottom,#000,transparent 8%,transparent 92%,#000);
 mask-image:linear-gradient(to right,#000,transparent 12%,transparent 88%,#000),linear-gradient(to bottom,#000,transparent 8%,transparent 92%,#000)}
</style></head><body>
<div id="bg"></div>
<div id="pages"></div>
<div id="scrim"></div>
<div id="edge"></div>
<div id="sheets"></div>
<canvas id="gl"></canvas>
<div id="menuShade"></div>
<div id="menu"></div>
<div id="dock"><div id="btns">
 <button class="on" aria-label="Аналітика"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg><span>Аналітика</span></button>
 <button aria-label="Борги"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M7 15h4"/></svg><span>Борги</span></button>
 <button aria-label="Ввід"><svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></svg><span>Ввід</span></button>
 <button aria-label="Дім"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8.5a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Дім</span></button>
 <button aria-label="Додатково"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg><span>Додатково</span></button>
</div></div>
<input id="inp" type="text" inputmode="text" enterkeyhint="send" autocomplete="off" autocorrect="off" autocapitalize="sentences" placeholder="Напишіть операцію: кава 25 зл" aria-label="Ввід операції">
